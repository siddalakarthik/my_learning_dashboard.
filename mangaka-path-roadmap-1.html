"id":34,"week":5,"phase":2,"title":"Shoulder Girdle & Clavicles","objective":"Understand how collarbones and shoulder blades ride on top of the ribcage independently, letting arms move without distorting the torso.","resources":["proko_anatomy_course"],"assignment":"Draw 5 torsos with the clavicle line added as a slightly curved line to each shoulder point, in both a relaxed and a raised-arm pose.","time":"60 min","mistakes":["Clavicles drawn as a perfectly straight line","Shoulders that don't shift position when an arm raises","Shoulder width copy-pasted identically across every figure regardless of build"],"checklist":["Does my clavicle line curve slightly rather than sit perfectly straight?","Do my shoulders visibly shift when I raise an arm?"],"outcome":"Shoulders that move believably with the arm instead of staying frozen to the ribcage."},{"id":35,"week":5,"phase":2,"title":"Leg Construction","objective":"Build the leg from two tapering cylinder-forms (thigh, calf) connected at a believable knee landmark.","resources":["proko_anatomy_course"],"assignment":"Draw 8 legs in varying poses (standing, bent, stepping), each built from a thigh cylinder and calf cylinder meeting at the knee.","time":"60–75 min","mistakes":["Thigh and calf drawn as one straight tube with no taper","Knee landmark placed inconsistently across poses","Ankle drawn too thin relative to the calf above it"],"checklist":["Do my thigh and calf cylinders each taper correctly?","Is my knee landmark placed at a consistent point across poses?"],"outcome":"Legs that hold weight and bend believably, built from clear, tapering forms."},{"id":36,"week":5,"phase":2,"title":"Arm Construction","objective":"Build the arm from upper-arm and forearm cylinders meeting at the elbow, keeping the forearm's twisting range in mind.","resources":["proko_anatomy_course","marcbrunet_male_body"],"assignment":"Draw 8 arms in varying poses (relaxed, bent, reaching), each built from two tapering cylinders meeting at the elbow.","time":"60–75 min","mistakes":["Elbow landmark placed inconsistently across poses","Forearm drawn as a straight tube ignoring its natural taper","Hand added as an afterthought, disconnected from the wrist"],"checklist":["Is my elbow landmark placed consistently across poses?","Does my forearm show a natural taper toward the wrist?"],"outcome":"Arms that bend and reach believably, ready to attach the hands you'll build next week."},{"id":37,"week":5,"phase":2,"title":"Week 5 Review — Full Figure From Construction","objective":"Consolidate anatomy basics into one full-figure construction demonstrating the week's core skills.","resources":["proko_anatomy_course"],"assignment":"One standing figure, 7.5 heads tall, weight-on-one-leg pose, built purely from ribcage/pelvis/spine construction — no outline tracing allowed.","time":"90–120 min","mistakes":["Reverting to outline-tracing under pressure instead of trusting the construction","Proportions drifting without a measuring check","Rushing the contrapposto relationship to save time"],"checklist":["Can I explain out loud why ribcage and pelvis tilt opposite ways in this pose?","Does my figure hold up to a head-unit ruler check?"],"outcome":"A full standing figure with correctly proportioned ribcage-pelvis-spine construction in a relaxed pose."},{"id":38,"week":6,"phase":2,"title":"Hand Basic Form","objective":"Simplify the hand into a mitten shape — palm block plus thumb wedge — before any fingers are added.","resources":["proko_hands"],"assignment":"Draw 10 mitten-hand shapes from different angles: just the palm block and thumb wedge, no fingers yet.","time":"60 min","mistakes":["Palm drawn as a flat 2D shape with no thickness","Thumb attached at the wrong point or angle","Treating the hand as symmetrical when it isn't"],"checklist":["Does my palm block read as a 3D form, not a flat shape?","Is my thumb wedge attached near the base of the palm, not the fingers?"],"outcome":"A confident, three-dimensional palm-and-thumb base ready to hold fingers."},{"id":39,"week":6,"phase":2,"title":"Finger Construction","objective":"Add fingers as simple tapering cylinder segments with correctly placed knuckle landmarks.","resources":["proko_hands","marcbrunet_hands_feet"],"assignment":"Add fingers to 6 of yesterday's mitten hands, using 3 cylinder segments per finger, and deliberately varying each finger's length.","time":"60–75 min","mistakes":["All fingers drawn the same length (real fingers vary noticeably)","Knuckle bends that don't align across the hand","Fingers drawn as flat tapered triangles instead of cylinders"],"checklist":["Do my fingers vary in length rather than all matching?","Do the knuckle landmarks stay aligned across the hand?"],"outcome":"Hands with fingers that read as cylindrical and correctly varied in length."},{"id":40,"week":6,"phase":2,"title":"Hand Gesture & Dynamic Poses","objective":"Apply gesture-drawing energy to the hand itself, capturing quick, expressive hand poses.","resources":["proko_hands"],"assignment":"12 quick (60–90 sec) gesture sketches of hands in different poses — relaxed, pointing, gripping, open — from photo reference.","time":"45–60 min","mistakes":["Treating the hand as rigid instead of finding its gesture line first","Spending too long per pose and losing energy","Ignoring the wrist's contribution to the overall pose"],"checklist":["Did I find one flowing gesture line before adding structure?","Did I stay within the time limit per pose?"],"outcome":"Hand sketches that feel alive and quickly captured, not stiffly labored over."},{"id":41,"week":6,"phase":2,"title":"Hands Interacting With Objects","objective":"Practice a hand gripping or holding something — exactly where most beginner hands go wrong.","resources":["proko_hands","marcbrunet_hands_feet"],"assignment":"Draw a hand holding 4 different objects (a pencil, a cup, a phone, a sword or weapon relevant to manga), focusing on where fingers compress around the object.","time":"60–75 min","mistakes":["Fingers that don't actually make contact with the object's surface","Object drawn first, hand forced awkwardly around it after","Ignoring the fat-pad compression where fingers grip"],"checklist":["Do my fingers actually contact and wrap the object's surface?","Did I construct the underlying hand before adding the object?"],"outcome":"Hands that convincingly grip rather than float near their objects."},{"id":42,"week":6,"phase":2,"title":"Foot Basic Form","objective":"Simplify the foot into a wedge/box construction before adding toes or detail.","resources":["proko_feet_playlist"],"assignment":"Draw 10 basic foot wedges from different angles: front, side, 3/4, and from above.","time":"60 min","mistakes":["Foot drawn as a flat 2D shape with no arch or volume","Ankle bones ignored or placed symmetrically (they aren't — the inner ankle sits higher)","Foot length inconsistent with the leg it's attached to"],"checklist":["Does my foot wedge show volume and a visible arch?","Are my inner and outer ankle bones at different heights?"],"outcome":"A basic three-dimensional foot form, ready for toes and perspective work."},{"id":43,"week":6,"phase":2,"title":"Foot in Perspective & Ankle Relationship","objective":"Draw the foot correctly foreshortened from tricky angles and connect it believably to the ankle and leg.","resources":["proko_feet_playlist"],"assignment":"Draw 8 feet in perspective-heavy angles (viewed from the front and from above), attaching each to a simple lower-leg cylinder.","time":"75 min","mistakes":["Foot drawn at full side-view length even when viewed from the front","Ankle attached at an inconsistent point on the foot wedge","Toes added before the underlying wedge perspective is solid"],"checklist":["Does my foot correctly foreshorten when viewed from the front or above?","Is the ankle attached at a consistent point relative to the foot wedge?"],"outcome":"Feet that hold up in perspective-heavy angles, not just the easy side view."},{"id":44,"week":6,"phase":2,"title":"Combine Hands + Feet Into Full Figures","objective":"Integrate this week's hand and foot construction into complete gesture figures from earlier weeks.","resources":["proko_hands","proko_feet_playlist"],"assignment":"Draw 4 full gesture figures, adding fully constructed hands and feet instead of simplified shapes or hidden-behind-the-back poses.","time":"90 min","mistakes":["Hiding hands or feet off-frame to avoid drawing them","Hands/feet more detailed than the rest of the figure, breaking visual consistency","Scale mismatch between hand/foot size and the rest of the body"],"checklist":["Did I draw the hands and feet fully instead of hiding them?","Are they in correct scale relative to the rest of the figure?"],"outcome":"Complete figures where hands and feet no longer feel like the weak link."},{"id":45,"week":6,"phase":2,"title":"Week 6 Review — Hand & Foot Study Sheet","objective":"Consolidate hand and foot construction into the week's portfolio sheet.","resources":["proko_hands","proko_feet_playlist"],"assignment":"A hand/feet study sheet: 6 hand poses (open, fist, pointing, holding an object, relaxed, gesturing) and 4 foot angles (front, side, 3/4, from above).","time":"90–120 min","mistakes":["Reaching for a photo reference instead of trusting construction","Rushing finger-length variation under time pressure","Skipping the trickier foreshortened foot angles"],"checklist":["Can I draw an open hand and a standing foot from construction, without a reference?","Do my fingers vary naturally in length?"],"outcome":"Basic hand and foot construction from multiple angles, without tracing a reference."},{"id":46,"week":7,"phase":2,"title":"Hair as Shapes & Clumps","objective":"Learn to see hair as a small number of large clump-shapes, not individual strands.","resources":["mark_crilley_playlist","david_finch_hair"],"assignment":"Draw 8 hairstyles on top of existing Loomis heads, using no more than 6–8 large clump-shapes per style — count your clumps out loud as you draw.","time":"60–75 min","mistakes":["Drawing dozens of thin individual strands instead of shapes","Hair that ignores the skull's volume underneath it","Clumps at wildly inconsistent scale within one hairstyle"],"checklist":["Can I count 6–8 distinct clump-shapes in each hairstyle?","Does the hair still show the skull's volume underneath?"],"outcome":"Hair that reads as clear, intentional shapes at a glance, not a tangle of lines."},{"id":47,"week":7,"phase":2,"title":"Hair Flow & Gravity","objective":"Direct all hair clumps to follow one consistent gravity or wind direction, so hair reads as physically real.","resources":["mark_crilley_playlist"],"assignment":"Draw 6 hairstyles, each with a gravity or wind direction arrow drawn first, keeping every clump obedient to that one direction.","time":"60 min","mistakes":["Clumps pointing in random, disagreeing directions","Ignoring gravity entirely on hanging sections of hair","Wind-blown hair that looks static rather than mid-motion"],"checklist":["Did I mark a direction arrow before drawing the hair?","Do all my clumps agree with that one direction?"],"outcome":"Hairstyles that feel like they're responding to one real physical force."},{"id":48,"week":7,"phase":2,"title":"Manga-Style Hair Stylization","objective":"Push realistic hair-clump logic toward manga's iconic spiky and flowing shapes while keeping it attached to a real skull.","resources":["mark_crilley_manga_faces","naoki_saito_playlist"],"assignment":"Draw 3 manga-style hairstyles on the same head — one spiky shonen-style, one flowing shoujo-style, one short practical style — comparing how far each pushes the clump shapes.","time":"75 min","mistakes":["Spikes that don't connect back to a believable hairline","Copying a specific character's exact hairstyle instead of building your own from clump logic","Losing the skull's volume under an exaggerated style"],"checklist":["Does each stylized hairstyle still connect to a believable hairline?","Could I explain the clump logic behind each style if asked?"],"outcome":"Three distinct manga hairstyles on one head, each built from understood clump logic rather than copied lines."},{"id":49,"week":7,"phase":2,"title":"Fabric Folds Fundamentals","objective":"Learn the core fold types — spiral, drop, zigzag, pipe/diaper folds — that make clothing look worn rather than painted on.","resources":["david_finch_folds"],"assignment":"Draw a simple sleeve or pant leg bent at a joint, 5 times, deliberately practicing one named fold type each time.","time":"60–75 min","mistakes":["Folds drawn as random scribbly lines instead of named, logical shapes","Fabric drawn perfectly smooth with zero folds anywhere","Folds that ignore where the body actually bends underneath"],"checklist":["Can I name which fold type I was practicing in each of the 5 drawings?","Do my folds originate from an actual bend point in the body?"],"outcome":"Five sleeve/pant-leg studies with clearly identifiable, logical fold types."},{"id":50,"week":7,"phase":2,"title":"Folds on a Moving Figure","objective":"Apply fold logic to a full gesture figure, showing tension folds pulling toward joints and compression folds bunching at bends.","resources":["david_finch_folds"],"assignment":"Take 3 gesture figures from earlier weeks and clothe them, adding tension folds at stretched areas and compression folds at bent areas.","time":"75 min","mistakes":["Identical fold treatment at both tension and compression points","Clothing that hides the gesture underneath entirely","Folds added as an afterthought instead of following the body's actual movement"],"checklist":["Can I point to a clear tension fold and a clear compression fold on each figure?","Is the original gesture still visible through the clothing?"],"outcome":"Clothed figures where the folds actually explain what the body underneath is doing."},{"id":51,"week":7,"phase":2,"title":"Simple Manga Outfit Construction","objective":"Design and construct one complete, simple manga-appropriate outfit on a full figure.","resources":["david_finch_folds","mark_crilley_playlist"],"assignment":"Draw one full figure wearing a complete simple outfit (blazer or jacket, shirt, bottom, shoes), applying this week's fold and hair skills together.","time":"90 min","mistakes":["Outfit pieces that don't sit on the body's construction underneath","Forgetting shoe/foot consistency from Week 6","Overcomplicating the outfit before the simple version is solid"],"checklist":["Does the outfit clearly sit on top of a constructed body, not float around it?","Did I include correctly constructed hands, feet, hair and folds together?"],"outcome":"One complete, believable clothed character combining this week's hair and fold skills."},{"id":52,"week":7,"phase":2,"title":"Week 7 Review — Clothed Character Bust","objective":"Consolidate hair and clothing into the week's portfolio piece.","resources":["mark_crilley_playlist","david_finch_folds"],"assignment":"One clothed character bust with manga-style hair, showing folds pulling toward at least one bent joint (elbow or shoulder).","time":"75–90 min","mistakes":["Rushing hair clump-counting under time pressure","Folds that don't clearly originate from a joint","Hairstyle disconnected from the skull underneath"],"checklist":["Does my hair read as clump-shapes with a clear direction?","Do my folds respond to an actual bend in the body?"],"outcome":"Manga-styled hair with clear clump logic, and simple clothing folds that respond to the body underneath."},{"id":53,"week":8,"phase":2,"title":"Facial Expression Fundamentals","objective":"Learn how eyebrows, eyes and mouth combine in specific, namable ways to build the 6 basic emotions.","resources":["proko_loomis_playlist","sinix_design_channel"],"assignment":"Draw 6 heads, one per basic emotion (happy, sad, angry, surprised, disgusted, afraid), changing brow, eye and mouth together each time.","time":"75–90 min","mistakes":["Relying only on the mouth to sell the emotion","Mixing signals from two different emotions in one face","Expressions too subtle to read at a glance"],"checklist":["Can I identify each emotion from the drawing alone, with no label?","Did brows, eyes and mouth all agree with each other?"],"outcome":"Six clearly readable basic expressions, each built from a coordinated brow/eye/mouth combination."},{"id":54,"week":8,"phase":2,"title":"Exaggerated Manga Expressions","objective":"Push realistic expressions toward manga's exaggerated, often chibi-style emotional shorthand.","resources":["mark_crilley_playlist","naoki_saito_playlist"],"assignment":"Redraw 4 of yesterday's expressions in exaggerated manga style (huge sparkling eyes for joy, a comedic anger mark, a gasping surprised mouth), then draw one full chibi-proportioned figure showing one emotion.","time":"75 min","mistakes":["Exaggerating everything equally instead of pushing one dominant feature hardest","Chibi proportions that ignore the same head-construction logic underneath","Over-decorating instead of actually exaggerating the expression, hurting readability"],"checklist":["Did I pick one dominant feature to exaggerate per expression?","Is my chibi figure built on the same construction logic as a normal figure, just compressed?"],"outcome":"Expressive, readable manga-exaggerated faces, plus a first chibi figure."},{"id":55,"week":8,"phase":2,"title":"Value Fundamentals","objective":"Learn the value scale and the difference between form shadow (on the object) and cast shadow (on the ground or other objects).","resources":["ctrlpaint_playlist"],"assignment":"Shade a 5-step value scale from white to black, then shade one sphere and one cube showing form shadow and cast shadow clearly separated.","time":"60 min","mistakes":["Value scale steps that aren't evenly spaced","Confusing form shadow and cast shadow, or blending them into one shape","Using only pure black and pure white, losing the middle values"],"checklist":["Are my 5 value steps evenly spaced from white to black?","Can I clearly point to the form shadow versus the cast shadow on each object?"],"outcome":"A clean value scale and two simple forms with clearly separated form and cast shadows."},{"id":56,"week":8,"phase":2,"title":"Light Source Logic on a Head","objective":"Apply value logic to a constructed head, keeping one consistent light source throughout.","resources":["ctrlpaint_playlist","sinix_design_channel"],"assignment":"Shade 3 heads from different angles, marking the light-source arrow on each BEFORE shading, using only 3 values: light, mid, shadow.","time":"75 min","mistakes":["Shadows that contradict each other across different features of the same face","Forgetting to mark the light source before starting","Using too many value steps and losing clarity"],"checklist":["Did I mark my light source before shading, every time?","Do all the shadows on one head agree with a single light direction?"],"outcome":"Three heads shaded with one clearly consistent light source each."},{"id":57,"week":8,"phase":2,"title":"Full Figure in Flat Manga-Style Value Blocks","objective":"Render a full clothed figure using flat, simplified value blocks the way manga uses black/white/gray before tone is even added.","resources":["sinix_design_channel","ctrlpaint_playlist"],"assignment":"Take one figure from Week 7 and render it in exactly 3 flat value blocks (black, white, one gray), no gradients — thinking about where a screentone would eventually go.","time":"75–90 min","mistakes":["Using soft gradients instead of committing to flat, clean value shapes","Ignoring the light source established earlier in the drawing","Adding more than 3 values before the simple version reads clearly"],"checklist":["Do my value shapes stay flat and clean, without soft gradients?","Does the figure still read clearly in just black/white/gray?"],"outcome":"A figure rendered in bold, flat manga-style value blocks that would already read clearly in print."},{"id":58,"week":8,"phase":2,"title":"Rim Light & Dramatic Manga Lighting","objective":"Add a rim light — a backlight tracing the character's silhouette — for the dramatic, high-contrast lighting common on manga covers.","resources":["sinix_design_channel"],"assignment":"Shade 2 character busts with a strong rim light in addition to the main light source, exaggerating the contrast for a cover-illustration feel.","time":"60–75 min","mistakes":["Rim light applied evenly all around instead of only the edge facing the backlight","Rim light so strong it destroys the readability of the main lighting","Forgetting the rim light needs its own light-source logic, opposite the key light"],"checklist":["Does my rim light only appear on the edge facing away from the main light?","Does the piece still read clearly despite the added drama?"],"outcome":"Two character busts with dramatic, cover-quality rim lighting layered on top of solid base shading."},{"id":59,"week":8,"phase":2,"title":"Practice: Full Character With Expression + Values","objective":"Combine this week's expression and value skills into one polished practice piece before Phase 2's final review.","resources":["sinix_design_channel","mark_crilley_playlist"],"assignment":"Draw and shade one full-body character showing a clear expression, correct proportions, clothing with folds, and 3-value flat rendering.","time":"120 min","mistakes":["Skipping earlier construction steps under the pressure of making a 'nicer' finished piece","Value rendering that ignores the established light source","An expression that doesn't match the energy of the pose"],"checklist":["Did I still build this from construction, not skip straight to outline?","Does the expression match the energy of the pose?"],"outcome":"One complete, confidently rendered character — a genuine step up from Day 1 of this phase."},{"id":60,"week":8,"phase":2,"title":"Phase 2 Review — Rendered Character Sheet","objective":"Demonstrate everything from Phase 2 on one consolidated sheet, and self-assess honestly before Phase 3 begins.","resources":["proko_anatomy_course","sinix_design_channel"],"assignment":"One full portfolio sheet: a complete rendered character (front view), a hand/foot study inset, and a 3-expression strip, all on one page. Then write 3 honest sentences about your weakest Phase 2 skill.","time":"150 min","mistakes":["Rushing the sheet just to 'be done with Phase 2' instead of showing your actual best current work","Skipping the honest self-assessment","Moving into manga stylization with fundamentally incorrect proportions still unresolved"],"checklist":["Can I honestly name my single weakest Phase 2 skill?","Is my figure anatomy solid enough that stylizing it on purpose in Phase 3 will read as a choice, not a mistake?"],"outcome":"A completed Phase 2 portfolio sheet, and a clear, honest sense of which figure-drawing skill still needs attention going into Phase 3."},{"id":61,"week":9,"phase":3,"title":"What Makes 'Manga Style'?","objective":"Understand stylization (line weight, simplified planes, iconic features) as a deliberate set of choices, not a shortcut around anatomy.","resources":["naoki_saito_playlist","sinix_design_channel"],"assignment":"Take one Day 26 realistic head and redraw it 3 times, each time simplifying ONE specific thing further (line count, eye detail, or nose detail), labeling what you removed each time.","time":"75 min","mistakes":["Simplifying randomly instead of deliberately","Removing so much detail the head stops reading as a face","Treating 'manga style' as only about the eyes"],"checklist":["Can I name exactly what I simplified in each of the 3 versions?","Does the most simplified version still read clearly as a face?"],"outcome":"A clear, personal understanding of what 'simplification' actually means, demonstrated across 3 real steps."},{"id":62,"week":9,"phase":3,"title":"Manga Eyes Deep-Dive","objective":"Learn the internal structure of manga eyes — iris shape, highlight placement, lid weight — so they can be varied deliberately, not copied.","resources":["mark_crilley_manga_faces","naoki_saito_playlist"],"assignment":"Draw 10 different manga eye studies, varying shape, highlight count/placement and lid thickness, noting which reads as which personality trait.","time":"75 min","mistakes":["Drawing the same eye shape 10 times with only surface details changed","Highlights placed randomly instead of matching a light-source logic","Forgetting the eye still sits inside a socket on a 3D head"],"checklist":["Do my 10 eyes show genuinely different shapes and structures, not just copies?","Does each highlight placement make sense with a light source?"],"outcome":"A personal reference sheet of 10 varied manga eye designs you actually understand the construction of."},{"id":63,"week":9,"phase":3,"title":"Style Exploration: 3 Manga Face Styles","objective":"Convert the same constructed head into 3 different manga sub-styles, proving the underlying construction is style-independent.","resources":["naoki_saito_playlist","mark_crilley_manga_faces"],"assignment":"Draw the same head 3 times in 3 different manga styles (a sharp shonen-action style, a soft shoujo style, a comedic chibi-adjacent style), keeping the same Loomis proportions underneath each.","time":"90 min","mistakes":["Proportions changing between styles instead of only the surface rendering","Styles that end up indistinguishable from each other","Abandoning the underlying construction entirely for the most exaggerated style"],"checklist":["Do all 3 heads still share the same underlying proportions?","Are the 3 styles clearly, distinctly different from one another?"],"outcome":"Proof that one solid construction can support multiple manga styles — a real, reusable skill."},{"id":64,"week":9,"phase":3,"title":"Character Design: Silhouette & Shape Language","objective":"Learn how basic shapes — circle, triangle, square — communicate different personality traits at a glance, before any detail is added.","resources":["sinix_design_channel"],"assignment":"Design 9 silhouettes for an imaginary character (3 circle-based, 3 triangle-based, 3 square-based), filled solid black with no internal detail. Note which shape best fits your intended personality.","time":"75 min","mistakes":["Every silhouette ending up roughly the same overall shape regardless of the base chosen","Adding internal line detail instead of keeping it a pure solid silhouette","Picking a shape at random instead of connecting it to a specific personality trait"],"checklist":["Are my 9 silhouettes genuinely different from each other in overall shape?","Can I explain why my chosen shape fits the character's personality?"],"outcome":"Nine genuinely distinct silhouettes, and a clear understanding of why shape reads before detail does."},{"id":65,"week":9,"phase":3,"title":"Character Design: Value-Based Thinking","objective":"Design a character's value distribution — where black, white and gray sit — before adding color, since manga is fundamentally a value medium.","resources":["sinix_design_channel","ctrlpaint_playlist"],"assignment":"Take your Day 64 silhouette winner and design 3 different black/white/gray value-distribution options for its costume, picking the one that reads most clearly at thumbnail size.","time":"75 min","mistakes":["Designing in color first and only translating to value as an afterthought","All 3 options ending up an even 50/50 black-white split with no dominant value","Not checking how the design reads when shrunk to thumbnail size"],"checklist":["Does one value clearly dominate in each of my 3 options, rather than an even split?","Did I check how each option reads at a small, thumbnail size?"],"outcome":"A character costume design chosen specifically for how well its value pattern reads in black and white."},{"id":66,"week":9,"phase":3,"title":"Designing Character #1","objective":"Combine silhouette, value design and face style into your first complete original character concept.","resources":["naoki_saito_playlist","sinix_design_channel"],"assignment":"Draw 5–8 thumbnail concept sketches for your first original manga character, then pick and refine one into a clean concept sketch (face and costume, front view).","time":"90–120 min","mistakes":["Refining the first thumbnail instead of genuinely comparing multiple options","Losing the strong silhouette from Day 64 during refinement","Designing the costume without considering the value pattern from Day 65"],"checklist":["Did I generate genuinely different thumbnail options before picking one?","Does my refined character keep a clear, readable silhouette and value pattern?"],"outcome":"Your first complete original manga character concept, chosen from real options rather than your first idea."},{"id":67,"week":9,"phase":3,"title":"Week 9 Review — Character Design Sheet #1","objective":"Consolidate this week's manga-style and character-design skills into a finished first character sheet.","resources":["naoki_saito_playlist","sinix_design_channel"],"assignment":"Character Design Sheet #1: your 5–8 thumbnails plus the one refined design, cleaned up as a presentable sheet.","time":"90–120 min","mistakes":["Presenting only the final design without the thumbnail process that shows your thinking","Second-guessing the design choice at the last minute","Skipping value-pattern consideration on the cleaned-up version"],"checklist":["Can I look at 3 thumbnails and explain why I didn't pick them?","Does the final sheet clearly show both the process and the result?"],"outcome":"An original manga-style character design with a distinct, readable silhouette, presented from your own thumbnails."},{"id":68,"week":10,"phase":3,"title":"Dynamic Action Lines","objective":"Learn to exaggerate a gesture's line of action specifically for manga's higher-energy visual language.","resources":["ethan_becker_channel","ahmed_aldoori_poses"],"assignment":"Take 8 of your calmer gesture sketches from Phase 1–2 and redraw each with the line of action pushed 30–50% further — same pose, more exaggerated energy.","time":"75 min","mistakes":["Exaggerating the outline/detail instead of the core line of action itself","Pushing the pose so far the anatomy becomes unreadable","Losing the pose's original weight and balance while exaggerating"],"checklist":["Is it clearly the same pose, just pushed further?","Does the pose still feel balanced despite the exaggeration?"],"outcome":"Eight poses with noticeably more manga-appropriate energy than their calmer originals."},{"id":69,"week":10,"phase":3,"title":"Foreshortening for Dramatic Poses","objective":"Learn the overlap-and-size logic that makes a punch or kick convincingly point toward the viewer instead of looking broken.","resources":["david_finch_panels","ahmed_aldoori_poses"],"assignment":"Draw 6 foreshortened poses (a fist punching toward camera, a kick, a lunge), focusing on which body parts overlap and which shrink in size closer to the viewer.","time":"90 min","mistakes":["Drawing the limb at full 'unforeshortened' length out of habit","Ignoring which part of the limb should overlap and hide behind another","Treating foreshortening as a perspective-math problem instead of an overlap-and-size one"],"checklist":["Does the foreshortened limb clearly overlap the body part behind it?","Does the nearest part of the limb read as noticeably larger than the far part?"],"outcome":"Foreshortened poses that read as 'pointing at the viewer' instead of anatomically broken."},{"id":70,"week":10,"phase":3,"title":"Speed Lines & Motion Indication","objective":"Learn manga's graphic vocabulary for indicating motion — speed lines, motion blur shapes, impact marks.","resources":["drawlikeasir_paneling","mark_crilley_playlist"],"assignment":"Take 3 of your dynamic poses from this week and add appropriate motion indicators: speed lines behind a running figure, an impact burst at a punch's point of contact, blur streaks on a fast-moving limb.","time":"60 min","mistakes":["Speed lines that don't actually follow the direction of motion","Overusing motion effects until the character itself is hard to see","Impact marks placed away from the actual point of contact"],"checklist":["Do my speed lines follow the actual direction of movement?","Is the character still clearly readable underneath the motion effects?"],"outcome":"Three dynamic poses with motion effects that clearly communicate speed and impact."},{"id":71,"week":10,"phase":3,"title":"Designing Character #2 + Dynamic Pose","objective":"Design a second original character built specifically around an action-oriented role, then pose them dynamically.","resources":["sinix_design_channel","ahmed_aldoori_poses"],"assignment":"Repeat Day 66's thumbnail-to-refined-design process for Character #2 (more action/combat-oriented than Character #1), then draw them in one dynamic action pose using this week's skills.","time":"120 min","mistakes":["Character #2 ending up too visually similar to Character #1","Costume design that would be impractical to draw consistently in dynamic action","Choosing the pose before the character design is finalized, causing rework"],"checklist":["Is Character #2 clearly visually distinct from Character #1 in silhouette?","Does the costume hold up in a dynamic action pose without falling apart?"],"outcome":"A second original character, action-posed, visually distinct from your first."},{"id":72,"week":10,"phase":3,"title":"Composition Fundamentals","objective":"Learn rule-of-thirds, leading lines, and focal-point placement for single-illustration composition.","resources":["sinix_design_channel"],"assignment":"Sketch 4 thumbnail compositions (under 2 minutes each) for the same character-in-a-scene idea, deliberately placing the focal point at a different rule-of-thirds intersection each time, then pick your strongest.","time":"60 min","mistakes":["Focal point placed dead-center in every thumbnail regardless of intent","No clear leading lines directing the eye toward the focal point","Spending too long per thumbnail and losing the point of fast iteration"],"checklist":["Is my focal point clearly placed at a rule-of-thirds intersection, not dead center?","Is there at least one leading line guiding the eye toward it?"],"outcome":"Four fast compositional thumbnails and one clear favorite, chosen for genuine compositional strength."},{"id":73,"week":10,"phase":3,"title":"Perspective in Manga Panels","objective":"Apply Phase 1's perspective skills specifically to dramatic manga panel choices — low angles, high angles, Dutch tilts.","resources":["david_finch_panels","david_finch_buildings"],"assignment":"Draw the same simple scene (a character standing in a doorway) 3 times: a low 'hero' angle, a high 'vulnerable' angle, and a Dutch-tilt 'unease' angle, keeping perspective construction honest in each.","time":"90 min","mistakes":["Extreme angles drawn 'by feel' without an actual vanishing point or horizon line underneath","All 3 angles feeling emotionally similar despite the different camera choice","Dutch tilt applied to the drawing itself instead of to the underlying perspective construction"],"checklist":["Does each angle still use honest perspective construction, not guesswork?","Do the 3 angles genuinely feel emotionally different from each other?"],"outcome":"Three panel-ready angle choices, each built on real perspective and each communicating a different feeling."},{"id":74,"week":10,"phase":3,"title":"Designing Character #3 + Full Trio Pose Practice","objective":"Complete your trio of original characters, then practice posing all three together.","resources":["ahmed_aldoori_poses","ethan_becker_channel"],"assignment":"Design Character #3 (a supporting/contrast role, with a different body type or age than #1 and #2), then draw all 3 characters together in one rough lineup, each in a distinct dynamic pose.","time":"120 min","mistakes":["Character #3 sharing a body type or silhouette too similar to #1 or #2","All 3 characters posed identically instead of showing distinct personalities","Scale or proportion mismatches between the 3 characters placed together"],"checklist":["Are all 3 characters visually distinct from each other in body type and silhouette?","Does each character's pose reflect their individual personality?"],"outcome":"Your complete cast of 3 original characters, together in one dynamic lineup for the first time."},{"id":75,"week":10,"phase":3,"title":"Week 10 Review — 3-Character Dynamic Lineup","objective":"Consolidate dynamic posing, foreshortening and composition into the week's portfolio piece.","resources":["ahmed_aldoori_poses","sinix_design_channel"],"assignment":"Refine Day 74's rough lineup into a cleaner page with correct anatomy and a clear focal point, applying Day 72's composition principles to how the 3 characters are arranged.","time":"120 min","mistakes":["Rushing anatomy accuracy in favor of 'cooler-looking' but broken poses","Forgetting composition lessons when arranging all 3 characters on one page","Inconsistent scale between the characters"],"checklist":["Can I push a gesture into an exaggerated, foreshortened pose while keeping anatomy readable?","Is there a clear focal point among the 3 characters?"],"outcome":"Three original characters in dynamic, foreshortened poses with correct anatomy and a clear focal point."},{"id":76,"week":11,"phase":3,"title":"Simple Interior Background","objective":"Apply 1–2-point perspective to a simple interior space a manga scene might actually use.","resources":["david_finch_buildings","drawabox_l1"],"assignment":"Draw a simple bedroom or classroom interior in 1-point perspective, including at least 3 pieces of furniture built from Phase 1's basic forms.","time":"90 min","mistakes":["Furniture that ignores the room's established vanishing point","Overloading the background with detail before the basic perspective box is solid","Forgetting a consistent light source for the whole room"],"checklist":["Does all my furniture share the room's single vanishing point?","Is there one consistent light source across the whole space?"],"outcome":"A simple, believable interior space your characters could actually stand inside."},{"id":77,"week":11,"phase":3,"title":"Exterior Background Basics","objective":"Apply 2-point perspective to a simplified street or cityscape background.","resources":["david_finch_buildings"],"assignment":"Draw a simplified street scene (2–3 buildings, a road, basic signage) in 2-point perspective, keeping detail minimal and shapes clean.","time":"90 min","mistakes":["Buildings that don't share the same two vanishing points","Over-detailing every window and brick instead of implying texture simply","Losing horizon-line consistency established at the start"],"checklist":["Do all my buildings share the same two vanishing points and horizon line?","Did I imply detail and texture simply rather than rendering every brick?"],"outcome":"A simplified but structurally correct street background, ready to place a character inside."},{"id":78,"week":11,"phase":3,"title":"Combining Character + Background","objective":"Place a character convincingly inside a background at correct scale, perspective and light direction.","resources":["david_finch_panels"],"assignment":"Take one of your 3 characters and place them inside either Day 76 or Day 77's background, matching their eye-level to the room's horizon line and their lighting to the scene's light source.","time":"90 min","mistakes":["Character's eye-level ignoring the background's actual horizon line, making them look like they're floating or sinking","Character lighting direction contradicting the background's established light source","Character drawn at a scale inconsistent with the furniture or buildings around them"],"checklist":["Does my character's eye-level align with the background's horizon line?","Does the character's lighting match the background's light source?"],"outcome":"Your first character-in-background panel that reads as one consistent, believable space."},{"id":79,"week":11,"phase":3,"title":"Comic Storytelling Grammar","objective":"Learn Scott McCloud's panel-to-panel transition types and the idea of 'closure' — what the reader's brain fills in between panels.","resources":["scott_mccloud_ted"],"assignment":"Watch the TED talk, then take a simple 4-beat story idea (character enters room → notices something → reacts → acts) and sketch it as 4 rough panels, labeling which transition type connects each pair.","time":"60–75 min","mistakes":["Panels that skip so much information the reader can't fill the gap","Panels that show near-identical moments with barely any change","Ignoring transition type entirely and just drawing 'what happens next' without intention"],"checklist":["Can I name the transition type between each pair of panels?","Would a reader seeing only these 4 panels understand the story beat?"],"outcome":"A clear, intentional 4-panel story beat with labeled transitions — proof you're now thinking in sequential art, not just single images."},{"id":80,"week":11,"phase":3,"title":"Paneling & Page Layout Fundamentals","objective":"Learn real manga page-layout principles: panel shapes, gutters, Z-pattern reading flow, and the 'fewer, bigger panels' rule.","resources":["drawlikeasir_paneling"],"assignment":"Design 4 different panel-layout grids for the same 5-beat story sequence, applying the Z-pattern eye-flow principle, then pick your clearest layout.","time":"75 min","mistakes":["Layouts with too many small, equally-sized panels that flatten the story's pacing","Panel order that doesn't actually follow a clean Z-pattern, confusing reading order","Choosing a layout for its 'cool factor' rather than its clarity"],"checklist":["Does my chosen layout follow a clear Z-pattern reading flow?","Are my most important story beats given the biggest panels?"],"outcome":"Four layout options and one clear winner, chosen specifically for reading clarity."},{"id":81,"week":11,"phase":3,"title":"Thumbnail Your One-Shot","objective":"Rough-thumbnail your entire 5–10 page one-shot manga before drawing a single clean line, using everything learned this week.","resources":["drawlikeasir_paneling","scott_mccloud_ted"],"assignment":"Write a one-paragraph story summary for your one-shot (using your 3 designed characters), then thumbnail every page as loose, stick-figure-level panels — speed over polish.","time":"120–150 min","mistakes":["Trying to make thumbnails 'clean' instead of fast and disposable","Starting finished art before the whole story is thumbnailed","Forcing a story that needs 20 pages into 5, losing clarity"],"checklist":["Is every page of my one-shot thumbnailed, even roughly?","Could a stranger follow the basic story from thumbnails alone?"],"outcome":"A complete rough draft of your entire manga story in thumbnail form — the hardest part of Phase 3, now done."},{"id":82,"week":11,"phase":3,"title":"Week 11 Review — Full Thumbnail Draft","objective":"Consolidate backgrounds and storytelling into the week's portfolio piece.","resources":["drawlikeasir_paneling","david_finch_panels"],"assignment":"Finalize your full rough thumbnail draft from Day 81, then clean up one character-in-background panel from Day 78 to near-finished quality.","time":"120 min","mistakes":["Continuing to revise the story instead of locking it in for Week 12's production phase","Perfectionism on thumbnails that only need to be clear, not pretty","Skipping the one 'proof of quality' finished panel"],"checklist":["Is my full one-shot thumbnailed page by page?","Do I have at least one finished, near-final-quality panel to gauge my current skill level?"],"outcome":"A full rough thumbnail draft of a multi-page manga story, plus one character correctly placed inside a background."},{"id":83,"week":12,"phase":3,"title":"Inking Fundamentals","objective":"Learn line-weight variation and tool control for confident, print-ready ink lines.","resources":["alphonso_dunn_penink","david_finch_inking"],"assignment":"Ink 3 of your existing pencil sketches, using thicker lines for outer silhouettes and shadow edges, and thinner lines for interior detail.","time":"90 min","mistakes":["Uniform line weight everywhere, making the image feel flat","Inking too fast and losing control of the line","Inking with no pencil underneath to guide it, at this early stage"],"checklist":["Do my outer silhouette lines read as thicker than my interior detail lines?","Do my inked lines stay as confident and controlled as Week 1's line-confidence training?"],"outcome":"Three inked pieces with intentional, readable line-weight variation."},{"id":84,"week":12,"phase":3,"title":"Screentone Fundamentals","objective":"Apply screentone — dot-pattern shading — to communicate value, material and mood the way real manga does.","resources":["csp_screentone_official","csp_screentone_manga"],"assignment":"Take one inked piece from Day 83 and apply 3 different tone densities to represent shadow, a mid-tone material like fabric, and a mood-setting background tone.","time":"75–90 min","mistakes":["Using the same single tone density for every different material or mood","Applying tone in a way that fights the underlying value structure from Week 8","Over-toning until the piece feels muddy instead of clean"],"checklist":["Did I use at least 2 distinct tone densities for different purposes?","Does the toning still respect the light source and value structure underneath?"],"outcome":"One fully-toned piece that reads with real manga-style shading logic."},{"id":85,"week":12,"phase":3,"title":"Final Project: Turnaround + Expression Sheet + Hand Sheet","objective":"Produce three of the eight final-project deliverables using every skill built so far.","resources":["proko_hands","naoki_saito_playlist"],"assignment":"Draw Character #1's full turnaround (front / 3–4 / side / back), a 6-expression sheet, and a 6-pose hand sheet, all inked.","time":"150–180 min","mistakes":["Turnaround views that don't actually match each other in proportion","Expression sheet reusing the same 1–2 exaggerated features on every expression","Hand-sheet poses that are all very similar instead of showing real variety"],"checklist":["Do all 4 turnaround views clearly show the same character?","Are my 6 expressions genuinely distinct from each other?"],"outcome":"Three completed, inked final-project deliverables: turnaround, expression sheet, and hand sheet."},{"id":86,"week":12,"phase":3,"title":"Final Project: Dynamic Pose Sheet + Background Scene","objective":"Produce two more final-project deliverables.","resources":["ahmed_aldoori_poses","david_finch_buildings"],"assignment":"Draw a dynamic pose sheet (3–4 action poses of any of your 3 characters) and one finished background scene with a character correctly placed inside it, both inked and toned.","time":"150–180 min","mistakes":["Pose-sheet poses that don't build on Week 10's foreshortening and action-line work","Background scene rushed relative to the character detail, feeling unfinished by comparison","Character-background integration issues resurfacing from Day 78"],"checklist":["Do my dynamic poses clearly build on Week 10's exaggeration and foreshortening skills?","Does the background feel like a finished scene, not a rushed afterthought?"],"outcome":"Two more completed final-project deliverables: dynamic pose sheet and background scene."},{"id":87,"week":12,"phase":3,"title":"Final Project: Cover Illustration","objective":"Produce the cover-illustration deliverable — a single, composition-strong hero image for your one-shot.","resources":["sinix_design_channel","david_finch_panels"],"assignment":"Using Week 10's composition skills, design and finish one cover illustration featuring your main character(s), fully inked and toned with dramatic, rim-light-informed lighting.","time":"150–180 min","mistakes":["Skipping the thumbnail-composition step and going straight to final line art","A cover composition with no clear single focal point","Rendering or toning that doesn't match the energy of the pose chosen"],"checklist":["Did I thumbnail at least 2–3 composition options before committing?","Is there one unmistakable focal point in the final cover?"],"outcome":"A finished cover illustration — the single image most people will judge your whole project by first."},{"id":88,"week":12,"phase":3,"title":"Final Project: One-Shot Pages, Part 1","objective":"Produce clean, finished pages from your Day 81 thumbnails — the first half of the one-shot.","resources":["alphonso_dunn_penink","csp_screentone_manga"],"assignment":"Take your thumbnails and produce clean pencils, inks and tone for the first half of your one-shot's pages, roughly page 1 through the midpoint.","time":"180+ min (can split across the day)","mistakes":["Deviating significantly from the Day 81 thumbnail layout mid-page, causing pacing problems","Polishing panel 1 to perfection while leaving later panels rushed","Inconsistent character proportions or style page to page, compared to your turnaround sheet"],"checklist":["Am I following my Day 81 thumbnail layout, adjusting only where clearly needed?","Do characters stay visually consistent with your Day 85 turnaround sheet?"],"outcome":"The first half of your one-shot manga, fully finished: pencilled, inked, and toned."},{"id":89,"week":12,"phase":3,"title":"Final Project: One-Shot Pages, Part 2 + Lettering","objective":"Finish the remaining pages and add basic dialogue lettering and sound-effect text.","resources":["alphonso_dunn_penink","drawlikeasir_paneling"],"assignment":"Finish inking and toning the remaining pages, then add simple speech bubbles and 2–3 sound-effect lettering moments, using this week's paneling and flow principles.","time":"180+ min (can split across the day)","mistakes":["Speech bubbles placed in an order that breaks the Z-pattern reading flow","Sound-effect lettering that doesn't match the visual energy of the action it represents","Rushing the final pages noticeably compared to the earlier, more-practiced ones"],"checklist":["Do my speech bubbles read in a clear, natural order?","Is my complete one-shot now fully inked, toned, and lettered start to finish?"],"outcome":"A complete, finished 5–10 page one-shot manga — inked, toned, and lettered."},{"id":90,"week":12,"phase":3,"title":"Final Review — Assemble Complete Portfolio","objective":"Assemble every final-project deliverable into one complete portfolio and honestly assess 90 days of growth.","resources":["proko_gesture_playlist","naoki_saito_playlist"],"assignment":"Lay out all 8 final deliverables together. Place your very first Day 1 and Day 7 pages next to today's work, and write a short honest reflection: what improved most, what still needs the most work, and a realistic plan for the next 90 days.","time":"120–150 min","mistakes":["Skipping the Day 1 comparison because early work feels embarrassing (it's the single most motivating exercise in the whole roadmap)","Treating Day 90 as 'finished forever' instead of the end of one structured cycle","Writing a vague reflection instead of naming specific next skills"],"checklist":["Is every one of the 8 final deliverables complete?","Did I actually compare today's work to Day 1?","Do I have a specific, named plan for what comes after Day 90?"],"outcome":"A complete 90-day manga portfolio, an honest sense of your real growth, and a concrete plan for what to build next."}],"finalProject":{"title":"The Day 90 Portfolio","intro":"These eight pieces aren't a Day-90 surprise — you've been building toward every one of them since Week 9. Character designs start Week 9, get posed dynamically in Week 10, get backgrounds in Week 11, and only get inked/toned/assembled in Week 12. Day 90 is assembly and polish, not a cold start.","deliverables":[{"name":"3 Original Manga Characters","built_on_days":[66,71,74],"description":"A visually distinct cast: a primary character (Week 9), an action-oriented second character (Week 10), and a contrasting supporting character with a different body type or age (Week 10). Distinct silhouettes, not palette-swaps of one design."},{"name":"Character Turnaround","built_on_days":[85],"description":"Character #1 drawn from front, 3/4, side, and back — all four views clearly the same person, same proportions, same construction."},{"name":"Expression Sheet","built_on_days":[28,53,54,85],"description":"6 distinct expressions of Character #1, each built from a coordinated brow/eye/mouth change, not just a different mouth on a static face."},{"name":"Hand Sheet","built_on_days":[38,39,40,41,85],"description":"6 hand poses in construction-correct perspective: relaxed, fist, pointing, holding an object, gesturing, gripping."},{"name":"Dynamic Pose Sheet","built_on_days":[68,69,74,86],"description":"3–4 exaggerated, foreshortened action poses showing off Week 10's line-of-action and foreshortening work."},{"name":"Background Scene","built_on_days":[76,77,78,86],"description":"One finished interior or exterior scene in correct perspective, with a character correctly integrated at matching scale, eye-level and light direction."},{"name":"Cover Illustration","built_on_days":[72,87],"description":"One composition-strong hero image, thumbnailed first, then fully inked and toned with dramatic, rim-light-informed lighting — the single image that represents the whole project."},{"name":"5–10 Page One-Shot Manga","built_on_days":[79,80,81,88,89],"description":"A complete short story using your 3 characters: thumbnailed (Week 11), then pencilled, inked, toned and lettered (Week 12) start to finish."}],"reality_check":"A genuinely complete, consistent, entirely-your-own-construction portfolio at Day 90 is a real, achievable, and honestly impressive outcome for 90 days from zero. It is the finish line of a strong foundation — not the finish line of becoming a professional mangaka. That takes years of continued, deliberate practice beyond this roadmap. Treat Day 90 as the end of cycle one, not the end of the journey."},"badges":[{"id":"first_steps","name":"First Steps","icon":"pencil","description":"Complete Day 1.","condition":{"type":"day","day":1}},{"id":"line_warrior","name":"Line Warrior","icon":"line","description":"Complete Week 1 — Line Confidence & Basic Shapes.","condition":{"type":"day","day":7}},{"id":"shape_shifter","name":"Shape Shifter","icon":"cube","description":"Complete Week 2 — Forms & Perspective.","condition":{"type":"day","day":15}},{"id":"gesture_ninja","name":"Gesture Ninja","icon":"flow","description":"Complete Week 3 — Construction & Gesture Drawing.","condition":{"type":"day","day":22}},{"id":"foundations_master","name":"Foundations Master","icon":"pillar","description":"Complete Phase 1 in full.","condition":{"type":"day","day":30}},{"id":"halfway_hero","name":"Halfway Hero","icon":"flag","description":"Reach Day 45 — the exact midpoint.","condition":{"type":"count","count":45}},{"id":"bone_collector","name":"Bone Collector","icon":"bone","description":"Complete Week 5 — Anatomy Basics & Proportions.","condition":{"type":"day","day":37}},{"id":"handy_work","name":"Handy Work","icon":"hand","description":"Complete Week 6 — Hands & Feet.","condition":{"type":"day","day":45}},{"id":"stylist","name":"Stylist","icon":"hair","description":"Complete Week 7 — Hair & Clothing.","condition":{"type":"day","day":52}},{"id":"figure_master","name":"Figure Drawing Master","icon":"figure","description":"Complete Phase 2 in full.","condition":{"type":"day","day":60}},{"id":"character_creator","name":"Character Creator","icon":"mask","description":"Complete Week 9 — Manga Style & Character Design.","condition":{"type":"day","day":67}},{"id":"action_star","name":"Action Star","icon":"burst","description":"Complete Week 10 — Dynamic Poses & Composition.","condition":{"type":"day","day":75}},{"id":"storyteller","name":"Storyteller","icon":"book","description":"Complete Week 11 — Backgrounds & Storytelling.","condition":{"type":"day","day":82}},{"id":"mangaka","name":"Mangaka","icon":"stamp","description":"Complete the full 90-day roadmap and final project.","condition":{"type":"day","day":90}},{"id":"streak_7","name":"7-Day Streak","icon":"fire","description":"Complete at least one day, 7 real-world days in a row.","condition":{"type":"streak","days":7}}]};
</script>
<script>

(function(){
'use strict';

/* ============================== CONSTANTS ============================== */
var STORAGE_KEY = 'mangaka_path_progress_v1';
var STATE_VERSION = 1;
var XP_PER_DAY = 100;
var XP_WEEK_BONUS = 200;
var XP_PHASE_BONUS = 500;
var XP_PER_LEVEL = 430;
var LEVEL_TITLES = [
  [1,'Blank Page'],[3,'Line Apprentice'],[6,'Form Student'],[9,'Gesture Adept'],
  [12,'Anatomy Scholar'],[15,'Figure Artist'],[18,'Style Explorer'],
  [21,'Storyboard Artist'],[24,'Inker'],[27,'Toning Master'],[30,'Mangaka']
];
var REVIEW_DAY_IDS = new Set(CURRICULUM.weeks.map(function(w){ return w.days[1]; }));

/* ============================== STATE ============================== */
var state = null;
var uiState = {
  openPhaseGroups: {1:true, 2:false, 3:false},
  openWeeks: {},
  mobileMenuOpen: false,
  searchOpen: false,
  resetModalOpen: false,
  embedsOpen: {}
};

function defaultState(){
  return {
    version: STATE_VERSION,
    startDate: localDateStr(new Date()),
    completedDays: {},
    checklist: {},
    notes: {},
    xp: 0,
    badges: {}
  };
}

function loadState(){
  var loaded = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) loaded = JSON.parse(raw);
  }catch(e){ console.warn('Progress could not be loaded from this browser.', e); }
  state = Object.assign(defaultState(), loaded || {});
  if(!state.startDate) state.startDate = localDateStr(new Date());
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.warn('Progress could not be saved in this browser.', e); }
}

/* ============================== DATA HELPERS ============================== */
function dayById(id){
  for(var i=0;i<CURRICULUM.days.length;i++){ if(CURRICULUM.days[i].id===id) return CURRICULUM.days[i]; }
  return null;
}
function weekByNum(n){
  for(var i=0;i<CURRICULUM.weeks.length;i++){ if(CURRICULUM.weeks[i].week===n) return CURRICULUM.weeks[i]; }
  return null;
}
function daysInWeek(n){ return CURRICULUM.days.filter(function(d){ return d.week===n; }); }
function daysInPhase(p){ return CURRICULUM.days.filter(function(d){ return d.phase===p; }); }
function isDayDone(id){ return !!(state.completedDays[id] && state.completedDays[id].done); }
function completedCount(){ return Object.keys(state.completedDays).filter(function(k){ return state.completedDays[k].done; }).length; }

/* ============================== XP / LEVEL / STREAK ============================== */
function getLevel(xp){ return Math.floor(xp / XP_PER_LEVEL) + 1; }
function xpForLevel(level){ return (level-1)*XP_PER_LEVEL; }
function getLevelTitle(level){
  var title = LEVEL_TITLES[0][1];
  for(var i=0;i<LEVEL_TITLES.length;i++){ if(level >= LEVEL_TITLES[i][0]) title = LEVEL_TITLES[i][1]; }
  return title;
}
function recalcXP(){
  var doneIds = Object.keys(state.completedDays).filter(function(k){ return state.completedDays[k].done; }).map(Number);
  var doneSet = new Set(doneIds);
  var xp = doneIds.length * XP_PER_DAY;
  CURRICULUM.weeks.forEach(function(w){
    var ids = daysInWeek(w.week).map(function(d){ return d.id; });
    if(ids.length && ids.every(function(id){ return doneSet.has(id); })) xp += XP_WEEK_BONUS;
  });
  [1,2,3].forEach(function(p){
    var ids = daysInPhase(p).map(function(d){ return d.id; });
    if(ids.length && ids.every(function(id){ return doneSet.has(id); })) xp += XP_PHASE_BONUS;
  });
  state.xp = xp;
}
function currentStreak(){
  var doneDates = new Set(Object.keys(state.completedDays)
    .filter(function(k){ return state.completedDays[k].done; })
    .map(function(k){ return localDateStr(new Date(state.completedDays[k].ts)); }));
  var streak = 0;
  var cursor = new Date();
  if(!doneDates.has(localDateStr(cursor))) cursor = addDays(cursor, -1);
  while(doneDates.has(localDateStr(cursor))){
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function checkBadges(){
  var newly = [];
  CURRICULUM.badges.forEach(function(b){
    if(state.badges[b.id] && state.badges[b.id].unlocked) return;
    var met = false;
    if(b.condition.type==='day') met = isDayDone(b.condition.day);
    else if(b.condition.type==='count') met = completedCount() >= b.condition.count;
    else if(b.condition.type==='streak') met = currentStreak() >= b.condition.days;
    if(met){
      state.badges[b.id] = {unlocked:true, ts:new Date().toISOString()};
      newly.push(b);
    }
  });
  if(newly.length){
    saveState();
    newly.forEach(function(b){ showToast('Badge Unlocked: ' + b.name, b.description, b.icon); });
  }
}

/* ============================== DATE HELPERS ============================== */
function localDateStr(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function parseLocalDate(str){
  var parts = str.split('-').map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function addDays(date, n){
  var d = new Date(date.getTime());
  d.setDate(d.getDate()+n);
  return d;
}
function dateToProgramDay(date, start){
  var a = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  var b = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  return Math.round((a-b)/86400000) + 1;
}
function monthsBetween(start, end){
  var out = [];
  var y = start.getFullYear(), m = start.getMonth();
  var endY = end.getFullYear(), endM = end.getMonth();
  while(y < endY || (y===endY && m<=endM)){
    out.push({year:y, month:m});
    m++; if(m>11){ m=0; y++; }
  }
  return out;
}

/* ============================== SMALL UTILS ============================== */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad(n){ return String(n).padStart(2,'0'); }
function toRoman(p){ return p===1?'I':(p===2?'II':'III'); }
function phaseTitle(p){ return p===1?'Foundations':(p===2?'Figure Drawing':'Manga Creation'); }
function phaseSubtitle(p){
  if(p===1) return "Line control, basic shapes, 3D forms, perspective, gesture drawing and head construction \u2014 the vocabulary every drawing after this will use.";
  if(p===2) return "Full-figure anatomy, hands, feet, hair, clothing, expressions, lighting and value \u2014 turning construction into a believable human figure.";
  return "Manga-specific style, original character design, dynamic action, backgrounds, storytelling and production \u2014 ending in a complete, inked and toned original manga.";
}
function icon(name, cls){
  return '<svg class="icon ' + (cls||'') + '" aria-hidden="true"><use href="#icon-' + name + '"></use></svg>';
}
function findNextDay(){
  for(var i=1;i<=90;i++){ if(!isDayDone(i)) return dayById(i); }
  return null;
}

/* ============================== ROUTING ============================== */
function parseRoute(){
  var raw = (location.hash || '#/dashboard').replace(/^#\/?/, '') || 'dashboard';
  if(['dashboard','calendar','final-project','notes','badges'].indexOf(raw) !== -1) return {view:raw};
  var m = raw.match(/^phase-(\d)(?:-w(\d+))?$/);
  if(m) return {view:'phase', phase:Number(m[1]), week: m[2]?Number(m[2]):null};
  m = raw.match(/^day-(\d+)$/);
  if(m) return {view:'day', day:Number(m[1])};
  return {view:'dashboard'};
}
function navigate(hash){
  if(location.hash === '#/'+hash) render();
  else location.hash = '#/'+hash;
}
function topbarLabel(r){
  if(r.view==='dashboard') return 'Dashboard';
  if(r.view==='phase') return 'Phase ' + toRoman(r.phase);
  if(r.view==='day') return 'Day ' + pad(r.day);
  if(r.view==='calendar') return 'Calendar';
  if(r.view==='final-project') return 'Final Project';
  if(r.view==='notes') return 'My Notes';
  if(r.view==='badges') return 'Badges';
  return 'Mangaka Path';
}

/* ============================== RENDER: SHELL PIECES ============================== */
function navItem(route, iconName, label, active){
  return '<button class="nav-item ' + (active?'is-active':'') + '" data-action="nav" data-route="' + route + '">' + icon(iconName) + '<span>' + label + '</span></button>';
}
function renderSidebarNavHtml(route){
  var html = '';
  html += navItem('dashboard','home','Dashboard', route.view==='dashboard');
  for(var p=1;p<=3;p++){
    var weeks = CURRICULUM.weeks.filter(function(w){ return w.phase===p; });
    var pDays = daysInPhase(p);
    var pDone = pDays.filter(function(d){ return isDayDone(d.id); }).length;
    var isOpen = uiState.openPhaseGroups[p];
    html += '<div class="nav-group ' + (isOpen?'is-open':'') + '">' +
      '<button class="nav-group__header" data-action="toggle-phase-group" data-phase="' + p + '">' +
        icon('book') + '<span>Phase ' + toRoman(p) + ' \u2014 ' + phaseTitle(p) + '</span>' +
        '<span class="nav-group__phase-progress">' + pDone + '/' + pDays.length + '</span>' +
        '<span class="nav-group__chevron">' + icon('chevron') + '</span>' +
      '</button>' +
      '<div class="nav-group__body"><div class="nav-group__body-inner">' +
        weeks.map(function(w){
          var wDays = daysInWeek(w.week);
          var wDone = wDays.filter(function(d){ return isDayDone(d.id); }).length;
          var active = route.view==='phase' && route.phase===p && route.week===w.week;
          return '<button class="nav-subitem ' + (active?'is-active':'') + '" data-action="nav" data-route="phase-' + p + '-w' + w.week + '">' +
            '<span class="nav-subitem__dot ' + (wDone===wDays.length?'is-done':'') + '"></span>' +
            '<span>Week ' + w.week + ': ' + escapeHtml(w.title) + '</span></button>';
        }).join('') +
        '<button class="nav-subitem" data-action="nav" data-route="phase-' + p + '"><span class="nav-subitem__dot"></span><span>All of Phase ' + toRoman(p) + '</span></button>' +
      '</div></div></div>';
  }
  html += navItem('calendar','calendar','Calendar', route.view==='calendar');
  html += navItem('final-project','flag','Final Project', route.view==='final-project');
  html += navItem('badges','trophy','Badges', route.view==='badges');
  html += navItem('notes','note','My Notes', route.view==='notes');
  return html;
}
function renderSidebarXPHtml(){
  var lvl = getLevel(state.xp);
  var title = getLevelTitle(lvl);
  var into = state.xp - xpForLevel(lvl);

/* ============================== RENDER: CALENDAR ============================== */
function renderCalendarMonth(year, month, start){
  var first = new Date(year, month, 1);
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var startDow = first.getDay();
  var monthName = first.toLocaleString('default',{month:'long'});
  var todayStr = localDateStr(new Date());
  var dow = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  var cells = '';
  for(var i=0;i<startDow;i++) cells += '<div class="calendar-cell is-empty"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var cellDate = new Date(year, month, d);
    var cellStr = localDateStr(cellDate);
    var progDay = dateToProgramDay(cellDate, start);
    var inRange = progDay>=1 && progDay<=90;
    var done = inRange && isDayDone(progDay);
    var isReview = inRange && REVIEW_DAY_IDS.has(progDay);
    var isToday = cellStr===todayStr;
    var classes = 'calendar-cell';
    if(inRange) classes += ' has-day';
    if(done) classes += ' is-done';
    if(isReview && !done) classes += ' is-review';
    if(isToday) classes += ' is-today';
    cells += '<div class="' + classes + '" ' + (inRange ? ('data-action="nav" data-route="day-' + progDay + '"') : '') + '>' +
      '<span class="calendar-cell__daynum">' + d + '</span>' +
      (inRange ? ('<span class="calendar-cell__prognum">D' + pad(progDay) + '</span>') : '') +
    '</div>';
  }
  return '<div class="panel panel--pad calendar-month"><div class="calendar-month__title">' + monthName + ' ' + year + '</div>' +
    '<div class="calendar-grid">' + dow.map(function(x){ return '<div class="calendar-dow">' + x + '</div>'; }).join('') + cells + '</div></div>';
}
function renderCalendar(){
  var start = parseLocalDate(state.startDate);
  var end = addDays(start, 89);
  var months = monthsBetween(start, end);
  return '<div class="view"><div class="view-header"><span class="eyebrow">90 Days, Mapped</span><h1 class="view-title">Calendar</h1>' +
    '<p class="view-subtitle">Set the date you started (or plan to start) and your 90 program days map onto real dates. This is a guide, not a lock \u2014 completion always comes from your own checkmarks, not the calendar.</p></div>' +
    '<div class="panel panel--pad calendar-toolbar">' +
      '<label for="startDateInput">Day 1 date</label>' +
      '<input type="date" id="startDateInput" value="' + state.startDate + '" data-action="set-start-date">' +
      '<div class="calendar-legend">' +
        '<span><span class="legend-dot" style="background:var(--hanko)"></span>Complete</span>' +
        '<span><span class="legend-dot" style="background:var(--ink-3);border:1px solid var(--hikou-dim)"></span>Week review</span>' +
        '<span><span class="legend-dot" style="background:var(--ink-3);outline:2px solid var(--hikou)"></span>Today</span>' +
      '</div>' +
    '</div>' +
    months.map(function(m){ return renderCalendarMonth(m.year, m.month, start); }).join('') +
  '</div>';
}

  var unlockedCount = CURRICULUM.badges.filter(function(b){ return state.badges[b.id] && state.badges[b.id].unlocked; }).length;
  return '<div class="view"><div class="view-header"><span class="eyebrow">Milestones</span><h1 class="view-title">Badges</h1>' +
    '<p class="view-subtitle">' + unlockedCount + ' / ' + CURRICULUM.badges.length + ' unlocked.</p></div>' +
    '<div class="badge-grid">' + CURRICULUM.badges.map(renderBadgeCard).join('') + '</div></div>';
}

/* ============================== VIEW DISPATCH ============================== */
function renderView(){
  var r = parseRoute();
  if(r.view==='phase'){
    uiState.openPhaseGroups[r.phase] = true;
    if(r.week) uiState.openWeeks[r.week] = true;
  }
  if(r.view==='day'){
    var d = dayById(r.day);
    if(d) uiState.openPhaseGroups[d.phase] = true;
  }
  var html;
  if(r.view==='dashboard') html = renderDashboard();
  else if(r.view==='phase') html = renderPhase(r.phase);
  else if(r.view==='day') html = renderDayDetail(r.day);
  else if(r.view==='calendar') html = renderCalendar();
  else if(r.view==='final-project') html = renderFinalProject();
  else if(r.view==='notes') html = renderNotes();
  else if(r.view==='badges') html = renderBadges();
  else html = renderDashboard();
  document.getElementById('main').innerHTML = html;
  renderSidebar(r);
  renderTabbar(r);
  renderTopbarTitle(r);
  return r;
}
function render(){
  var r = renderView();
  if(r.view==='phase' && r.week){
    var el = document.getElementById('week-'+r.week);
    if(el) setTimeout(function(){ el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
  } else {
    window.scrollTo({top:0});
  }
}
function refresh(){
  var y = window.scrollY;
  renderView();
  window.scrollTo({top:y});
}

/* ============================== ACTIONS ============================== */
function toggleDayComplete(id, checked){
  var isDone = isDayDone(id);
  if(checked === isDone) return;
  if(checked) state.completedDays[id] = {done:true, ts:new Date().toISOString()};
  else delete state.completedDays[id];
  recalcXP();
  saveState();
  checkBadges();
  refresh();
}
function openSearch(){
  uiState.searchOpen = true;
  document.getElementById('searchOverlay').classList.add('is-open');
  renderSearchResults('');
  var input = document.getElementById('searchInput');
  input.value = '';
  setTimeout(function(){ input.focus(); }, 60);
}
function closeSearch(){
  uiState.searchOpen = false;
  document.getElementById('searchOverlay').classList.remove('is-open');
}
function renderSearchResults(query){
  var box = document.getElementById('searchResults');
  if(!box) return;
  var q = query.trim().toLowerCase();
  if(!q){ box.innerHTML = '<div class="search-empty">Type to search all 90 days\u2026</div>'; return; }
  var results = CURRICULUM.days.filter(function(d){
    return d.title.toLowerCase().indexOf(q)!==-1 || d.objective.toLowerCase().indexOf(q)!==-1 || d.assignment.toLowerCase().indexOf(q)!==-1;
  }).slice(0,20);
  if(!results.length){ box.innerHTML = '<div class="search-empty">No matching days.</div>'; return; }
  box.innerHTML = results.map(function(d){
    return '<div class="search-result" data-action="search-result" data-day="' + d.id + '">' +
      '<span class="search-result__num">D' + pad(d.id) + '</span>' +
      '<div><div class="search-result__title">' + escapeHtml(d.title) + '</div><div class="search-result__meta">Week ' + d.week + ' \u00b7 Phase ' + toRoman(d.phase) + '</div></div></div>';
  }).join('');
}
function openMobileMenu(){
  uiState.mobileMenuOpen = true;
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebarScrim').classList.add('is-open');
}
function closeMobileMenu(){
  uiState.mobileMenuOpen = false;
  var sb = document.getElementById('sidebar');
  if(sb) sb.classList.remove('mobile-open');
  var scrim = document.getElementById('sidebarScrim');
  if(scrim) scrim.classList.remove('is-open');
}
function openResetModal(){
  uiState.resetModalOpen = true;
  document.getElementById('resetModal').classList.add('is-open');
}
function closeResetModal(){
  uiState.resetModalOpen = false;
  document.getElementById('resetModal').classList.remove('is-open');
}
function doResetProgress(){
  state = defaultState();
  saveState();
  closeResetModal();
  refresh();
}
function exportProgress(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mangaka-path-progress.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('Progress exported', 'Saved as mangaka-path-progress.json', 'download');
}
function handleImportFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(parsed && typeof parsed==='object'){
        state = Object.assign(defaultState(), parsed);
        recalcXP();
        saveState();
        checkBadges();
        refresh();
        showToast('Progress imported', 'Your saved file has been loaded.', 'upload');
      }
    }catch(err){
      showToast('Import failed', 'That file could not be read as valid progress data.', 'alert');
    }
  };
  reader.readAsText(file);
}
function showToast(title, sub, iconName){
  var container = document.getElementById('toastContainer');
  if(!container) return;
  var el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<div class="badge-stamp" style="width:38px;height:38px;flex-shrink:0">' + icon(iconName||'star') + '</div>' +
    '<div><div class="toast__title">' + escapeHtml(title) + '</div><div class="toast__sub">' + escapeHtml(sub||'') + '</div></div>';
  container.appendChild(el);
  setTimeout(function(){
    el.classList.add('is-leaving');
    setTimeout(function(){ el.remove(); }, 300);
  }, 4200);
}

/* ============================== EVENT DELEGATION ============================== */
document.addEventListener('click', function(e){
  if(e.target.tagName === 'INPUT') return;
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;

  if(action==='nav'){ e.preventDefault(); navigate(el.dataset.route); closeMobileMenu(); return; }
  if(action==='toggle-phase-group'){ uiState.openPhaseGroups[Number(el.dataset.phase)] = !uiState.openPhaseGroups[Number(el.dataset.phase)]; refresh(); return; }
  if(action==='toggle-week'){ var w = Number(el.dataset.week); uiState.openWeeks[w] = !uiState.openWeeks[w]; refresh(); return; }
  if(action==='toggle-embed'){ uiState.embedsOpen[el.dataset.key] = !uiState.embedsOpen[el.dataset.key]; refresh(); return; }
  if(action==='open-search'){ openSearch(); return; }
  if(action==='close-search'){ closeSearch(); return; }
  if(action==='search-result'){ closeSearch(); navigate('day-'+el.dataset.day); return; }
  if(action==='open-menu'){ openMobileMenu(); return; }
  if(action==='close-menu'){ closeMobileMenu(); return; }
  if(action==='reset-progress'){ openResetModal(); return; }
  if(action==='confirm-reset'){ doResetProgress(); return; }
  if(action==='cancel-reset'){ closeResetModal(); return; }
  if(action==='export-progress'){ exportProgress(); return; }
  if(action==='trigger-import'){ document.getElementById('importFileInput').click(); return; }
});

document.addEventListener('change', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  if(action==='toggle-day'){ toggleDayComplete(Number(el.dataset.day), el.checked); return; }
  if(action==='toggle-checklist'){
    var dId = el.dataset.day, idx = Number(el.dataset.idx);
    if(!state.checklist[dId]) state.checklist[dId] = [];
    state.checklist[dId][idx] = el.checked;
    saveState();
    return;
  }
  if(action==='set-start-date'){ state.startDate = el.value; saveState(); refresh(); return; }
  if(action==='import-file'){ handleImportFile(el.files[0]); return; }
});

var notesDebounceTimer = null;
document.addEventListener('input', function(e){
  if(e.target.matches && e.target.matches('[data-action="notes-input"]')){
    var id = e.target.dataset.day;
    var val = e.target.value;
    var hint = document.getElementById('notesHint-'+id);
    if(hint) hint.textContent = 'Saving\u2026';
    clearTimeout(notesDebounceTimer);
    notesDebounceTimer = setTimeout(function(){
      state.notes[id] = val;
      saveState();
      var h = document.getElementById('notesHint-'+id);
      if(h) h.textContent = 'Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }, 500);
    return;
  }
  if(e.target.id==='searchInput'){ renderSearchResults(e.target.value); }
});

document.addEventListener('keydown', function(e){
  if(e.key==='/' && !uiState.searchOpen){
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag!=='TEXTAREA' && tag!=='INPUT'){ e.preventDefault(); openSearch(); }
  }
  if(e.key==='Escape'){
    if(uiState.searchOpen) closeSearch();
    if(uiState.resetModalOpen) closeResetModal();
    if(uiState.mobileMenuOpen) closeMobileMenu();
  }
});

/* ============================== INIT ============================== */
function init(){
  loadState();
  recalcXP();
  saveState();
  checkBadges();
  window.addEventListener('hashchange', render);
  render();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>
</body>
</html>
