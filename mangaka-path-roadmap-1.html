<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mangaka Path — 90-Day Manga Mastery Roadmap</title>
<meta name="description" content="A researched 90-day roadmap and progress dashboard: absolute beginner to strong intermediate manga artist.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#0A0A0D;
  --ink-2:#131318;
  --ink-3:#1B1B22;
  --ink-4:#232330;
  --ink-border:#2B2B37;
  --ink-border-soft:#1F1F28;
  --paper:#EDEAE0;
  --paper-dim:#9490A6;
  --paper-faint:#605C70;
  --hanko:#C6303F;
  --hanko-bright:#E1495A;
  --hanko-dim:#7A2029;
  --hikou:#6690C2;
  --hikou-dim:#3E5A80;
  --gold:#D3A44E;
  --tone-dot:rgba(237,234,224,0.055);
  --tone-dot-strong:rgba(237,234,224,0.09);
  --shadow-hard:2px 3px 0 rgba(0,0,0,0.5);
  --shadow-hard-lg:4px 5px 0 rgba(0,0,0,0.45);
  --radius-s:4px;
  --radius-m:7px;
  --radius-l:12px;
  --font-display:'Bebas Neue', Impact, 'Haettenschweiler', sans-serif;
  --font-body:'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', 'Segoe UI', Roboto, sans-serif;
  --font-mono:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  --sidebar-w:270px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
a{color:var(--hikou)}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--hanko);color:var(--paper)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--ink-2)}
::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--hanko-dim)}

.tone-bg{
  background-image:radial-gradient(circle, var(--tone-dot) 1px, transparent 1.3px);
  background-size:7px 7px;
}
body{
  background-image:radial-gradient(circle, var(--tone-dot) 1px, transparent 1.3px);
  background-size:16px 16px;
  background-attachment:fixed;
}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- icons ---------- */
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block;vertical-align:-0.15em}
.icon--fill{fill:currentColor;stroke:none}

/* ---------- app shell ---------- */
.app-shell{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--ink-2);
  border-right:1px solid var(--ink-border-soft);
  display:flex;
  flex-direction:column;
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
}
.sidebar__brand{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--ink-border-soft);
}
.sidebar__brand-title{
  font-family:var(--font-display);
  font-size:30px;
  letter-spacing:0.5px;
  color:var(--paper);
  line-height:1;
}
.sidebar__brand-title span{color:var(--hanko)}
.sidebar__brand-sub{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--paper-faint);
  margin-top:5px;
}

.sidebar__search-trigger{
  display:flex;align-items:center;gap:9px;width:calc(100% - 32px);margin:14px 16px 0;
  background:var(--ink-3);border:1px solid var(--ink-border);color:var(--paper-faint);
  padding:9px 11px;border-radius:var(--radius-m);font-size:13px;text-align:left;
}
.sidebar__search-trigger:hover{border-color:var(--hikou-dim);color:var(--paper)}
.sidebar__search-trigger span:nth-child(2){flex:1}
.sidebar__search-kbd{
  font-family:var(--font-mono);font-size:10.5px;color:var(--paper-faint);
  border:1px solid var(--ink-border);border-radius:4px;padding:1px 6px;
}
.sidebar__xp{
  margin:14px 16px;
  padding:12px 14px;
  background:var(--ink-3);
  border:1px solid var(--ink-border);
  border-radius:var(--radius-m);
}
.sidebar__xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sidebar__level{font-family:var(--font-display);font-size:19px;color:var(--gold);letter-spacing:0.3px}
.sidebar__xp-num{font-family:var(--font-mono);font-size:11px;color:var(--paper-dim)}
.xp-track{height:6px;border-radius:4px;background:var(--tone-dot-strong);overflow:hidden;position:relative}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--hanko-dim),var(--hanko));border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.sidebar__nav{flex:1;padding:8px 10px 14px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:none;border:none;color:var(--paper-dim);
  padding:10px 10px;border-radius:var(--radius-s);
  font-size:14px;font-weight:500;
  transition:background .15s,color .15s;
}
.nav-item .icon{color:var(--paper-faint);transition:color .15s}
.nav-item:hover{background:var(--ink-3);color:var(--paper)}
.nav-item.is-active{background:var(--ink-4);color:var(--paper)}
.nav-item.is-active .icon{color:var(--hanko-bright)}

.nav-group{margin-top:2px}
.nav-group__header{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;color:var(--paper-dim);
  padding:10px 10px;border-radius:var(--radius-s);font-size:14px;font-weight:600;
  text-align:left;
}
.nav-group__header:hover{background:var(--ink-3);color:var(--paper)}
.nav-group__header .icon{color:var(--paper-faint)}
.nav-group__phase-progress{
  margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--paper-faint);
}
.nav-group__chevron{transition:transform .25s ease;color:var(--paper-faint)!important}
.nav-group.is-open .nav-group__chevron{transform:rotate(90deg)}
.nav-group__body{
  display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;
}
.nav-group.is-open .nav-group__body{grid-template-rows:1fr}
.nav-group__body-inner{overflow:hidden}
.nav-subitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;color:var(--paper-faint);
  padding:7px 10px 7px 30px;border-radius:var(--radius-s);font-size:13px;
}
.nav-subitem:hover{background:var(--ink-3);color:var(--paper)}
.nav-subitem.is-active{color:var(--hanko-bright);background:var(--ink-3)}
.nav-subitem__dot{width:6px;height:6px;border-radius:50%;background:var(--ink-border);flex-shrink:0}
.nav-subitem__dot.is-done{background:var(--hanko)}

.sidebar__footer{padding:12px 16px 16px;border-top:1px solid var(--ink-border-soft);display:flex;gap:8px}

/* ---------- topbar (mobile) ---------- */
.topbar{
  display:none;
  align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--ink-2);
  border-bottom:1px solid var(--ink-border-soft);
  position:sticky;top:0;z-index:20;
}
.topbar__title{font-family:var(--font-display);font-size:22px;letter-spacing:.3px;flex:1}
.topbar__title span{color:var(--hanko)}
.icon-btn{
  background:var(--ink-3);border:1px solid var(--ink-border);color:var(--paper);
  width:38px;height:38px;border-radius:var(--radius-s);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.icon-btn:active{transform:translateY(1px)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:32px 40px 90px}
.view{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view-header{margin-bottom:26px}
.eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--hanko-bright);margin-bottom:6px;display:block;
}
.view-title{font-family:var(--font-display);font-size:38px;letter-spacing:.3px;color:var(--paper)}
.view-subtitle{color:var(--paper-dim);margin-top:8px;max-width:640px;font-size:14.5px}

/* ---------- cards / panels ---------- */
.panel{
  background:var(--ink-2);
  border:1.5px solid var(--ink-border);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-hard);
}
.panel--pad{padding:20px 22px}

/* ---------- dashboard hero ---------- */
.hero{
  display:grid;grid-template-columns:auto 1fr;gap:28px;
  padding:26px 28px;margin-bottom:22px;align-items:center;
}
.hero__ring-wrap{position:relative;width:118px;height:118px;flex-shrink:0}
.hero__ring-wrap svg{transform:rotate(-90deg)}
.hero__ring-pct{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.hero__ring-pct b{font-family:var(--font-display);font-size:26px;color:var(--paper)}
.hero__ring-pct span{font-family:var(--font-mono);font-size:9px;color:var(--paper-faint);letter-spacing:1px}
.hero__body h2{font-family:var(--font-display);font-size:26px;letter-spacing:.3px;margin-bottom:6px}
.hero__body p{color:var(--paper-dim);font-size:14px;margin-bottom:14px}
.hero__actions{display:flex;gap:10px;flex-wrap:wrap}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:22px}
.stat-card{padding:16px 18px}
.stat-card__num{font-family:var(--font-display);font-size:28px;color:var(--paper);line-height:1}
.stat-card__label{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint);margin-top:6px}

.phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:22px}
.phase-card{padding:18px 20px;cursor:pointer;transition:transform .15s,border-color .15s}
.phase-card:hover{transform:translateY(-2px);border-color:var(--hanko-dim)}
.phase-card__num{font-family:var(--font-mono);font-size:11px;color:var(--paper-faint);letter-spacing:1px}
.phase-card__title{font-family:var(--font-display);font-size:22px;margin:4px 0 10px}
.phase-card__bar{height:8px;border-radius:5px}

.section-heading{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 0 12px;font-family:var(--font-display);font-size:19px;letter-spacing:.3px;color:var(--paper);
}
.section-heading .icon{color:var(--hanko-bright);margin-right:8px}

.badges-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}

/* ---------- progress bars ---------- */
.progress-bar{height:9px;border-radius:6px;overflow:hidden;position:relative}
.progress-bar__fill{height:100%;background:linear-gradient(90deg,var(--hanko-dim),var(--hanko-bright));transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ---------- badges ---------- */
.badge-chip,.badge-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  width:84px;
}
.badge-card{width:auto;padding:16px 10px}
.badge-stamp{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, var(--hanko-bright), var(--hanko) 60%, var(--hanko-dim) 100%);
  border:2px solid var(--hanko-bright);
  color:var(--paper);
  box-shadow:0 0 0 3px rgba(198,48,63,0.15);
  transform:rotate(-6deg);
}
.badge-stamp .icon{width:24px;height:24px}
.badge-chip.is-locked .badge-stamp,.badge-card.is-locked .badge-stamp{
  background:var(--ink-3);border-color:var(--ink-border);color:var(--paper-faint);box-shadow:none;
}
.badge-name{font-size:11.5px;font-weight:700;color:var(--paper)}
.badge-chip.is-locked .badge-name,.badge-card.is-locked .badge-name{color:var(--paper-faint)}
.badge-desc{font-size:11px;color:var(--paper-dim);line-height:1.4}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}

/* ---------- week block / day rows ---------- */
.week-block{margin-bottom:16px;overflow:hidden}
.week-block__header{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:none;color:var(--paper);padding:16px 20px;
}
.week-block__header:hover{background:var(--ink-3)}
.week-block__index{font-family:var(--font-mono);font-size:11px;color:var(--paper-faint);letter-spacing:1px;white-space:nowrap}
.week-block__title{font-weight:700;font-size:15px;flex:1}
.week-block__meta{font-family:var(--font-mono);font-size:11px;color:var(--paper-faint)}
.week-block__chevron{transition:transform .25s ease;color:var(--paper-faint)}
.week-block.is-open .week-block__chevron{transform:rotate(90deg)}
.week-block__progress{width:64px;height:5px;border-radius:4px;margin-left:8px}
.week-block__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;border-top:1px solid transparent}
.week-block.is-open .week-block__body{grid-template-rows:1fr;border-top:1px solid var(--ink-border-soft)}
.week-block__body-inner{overflow:hidden}

.day-row{
  display:flex;align-items:flex-start;gap:12px;padding:13px 20px;
  border-bottom:1px solid var(--ink-border-soft);cursor:pointer;
}
.day-row:last-child{border-bottom:none}
.day-row:hover{background:var(--ink-3)}
.day-row.is-review{background:rgba(198,48,63,0.06)}
.day-row__check{margin-top:2px;flex-shrink:0}
.day-row__num{font-family:var(--font-mono);font-size:11px;color:var(--paper-faint);width:34px;flex-shrink:0;padding-top:2px}
.day-row__body{flex:1;min-width:0}
.day-row__title{font-size:13.5px;font-weight:600;color:var(--paper)}
.day-row.is-done .day-row__title{color:var(--paper-dim);text-decoration:line-through;text-decoration-color:var(--hanko-dim)}
.day-row__obj{font-size:12px;color:var(--paper-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-row__time{font-family:var(--font-mono);font-size:10.5px;color:var(--paper-faint);white-space:nowrap;padding-top:2px}

.checkbox{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:5px;
  border:2px solid var(--ink-border);background:var(--ink);cursor:pointer;position:relative;flex-shrink:0;
  transition:border-color .15s,background .15s;
}
.checkbox:hover{border-color:var(--hanko-dim)}
.checkbox:checked{background:var(--hanko);border-color:var(--hanko)}
.checkbox:checked::after{
  content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg);
}

.week-review-card{margin:14px 20px 18px;padding:16px 18px;background:var(--ink-3);border:1.5px dashed var(--hanko-dim);border-radius:var(--radius-m)}
.week-review-card__title{font-family:var(--font-display);font-size:16px;color:var(--hanko-bright);letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.review-row{margin-bottom:10px}
.review-row:last-child{margin-bottom:0}
.review-row__label{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-faint);margin-bottom:3px}
.review-row__text{font-size:13px;color:var(--paper-dim);line-height:1.55}

/* ---------- day detail ---------- */
.day-detail__top{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.day-detail__check-wrap{padding-top:6px}
.day-detail__check{width:30px;height:30px;border-radius:8px}
.day-detail__check:checked::after{left:9px;top:4px;width:7px;height:14px}
.day-detail__meta-row{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.pill{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.5px;
  padding:3px 9px;border-radius:20px;border:1px solid var(--ink-border);color:var(--paper-dim);
  display:inline-flex;align-items:center;gap:5px;
}
.pill--time .icon{width:11px;height:11px}
.pill--hanko{border-color:var(--hanko-dim);color:var(--hanko-bright)}

.day-section{margin-bottom:22px}
.day-section__label{
  display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--hanko-bright);margin-bottom:9px;
}
.day-section__label .icon{width:14px;height:14px}
.day-section__body{font-size:14.5px;color:var(--paper);line-height:1.65}
.day-section__body p{margin-bottom:8px}
.mistake-list,.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mistake-list li{display:flex;gap:9px;font-size:13.5px;color:var(--paper-dim);line-height:1.5}
.mistake-list li::before{content:'\2715';color:var(--hanko-bright);flex-shrink:0;font-size:11px;padding-top:2px}
.check-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--paper);line-height:1.5}
.outcome-box{
  padding:14px 16px;background:rgba(102,144,194,0.08);border:1.5px solid var(--hikou-dim);border-radius:var(--radius-m);
  font-size:14px;color:var(--paper);line-height:1.6;
}

.resource-card{
  display:flex;gap:12px;padding:12px;margin-bottom:10px;border-radius:var(--radius-m);
  background:var(--ink-3);border:1px solid var(--ink-border);
}
.resource-card__thumb{
  width:100px;height:64px;flex-shrink:0;border-radius:var(--radius-s);background:var(--ink);
  background-size:cover;background-position:center;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--ink-border);
}
.resource-card__thumb .icon{color:rgba(237,234,224,.85);width:22px;height:22px}
.resource-card__thumb.no-thumb{background:var(--ink-4)}
.resource-card__body{flex:1;min-width:0}
.resource-card__creator{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--hanko-bright)}
.resource-card__title{font-weight:700;font-size:13.5px;color:var(--paper);margin:2px 0 5px}
.resource-card__why{font-size:12px;color:var(--paper-dim);line-height:1.5;margin-bottom:8px}
.resource-card__actions{display:flex;gap:8px;flex-wrap:wrap}
.resource-card__link{font-family:var(--font-mono);font-size:11px;color:var(--hikou);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.resource-card__link:hover{color:var(--paper)}
.resource-embed{margin-top:10px;border-radius:var(--radius-s);overflow:hidden;background:#000;aspect-ratio:16/9}
.resource-embed iframe{width:100%;height:100%;border:0;display:block}

.notes-box{margin-top:6px}
textarea.notes-input{
  width:100%;min-height:110px;background:var(--ink);border:1.5px solid var(--ink-border);
  border-radius:var(--radius-m);color:var(--paper);font-family:var(--font-body);font-size:13.5px;
  padding:12px 14px;resize:vertical;line-height:1.55;
}
textarea.notes-input:focus{outline:none;border-color:var(--hikou-dim)}
.notes-save-hint{font-family:var(--font-mono);font-size:10px;color:var(--paper-faint);margin-top:6px}

.day-nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-s);font-size:13.5px;font-weight:700;
  border:1.5px solid transparent;box-shadow:var(--shadow-hard);transition:transform .1s;
}
.btn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
.btn--primary{background:var(--hanko);color:#fff;border-color:var(--hanko-bright)}
.btn--primary:hover{background:var(--hanko-bright)}
.btn--ghost{background:var(--ink-3);color:var(--paper);border-color:var(--ink-border)}
.btn--ghost:hover{border-color:var(--paper-faint)}
.btn--sm{padding:7px 12px;font-size:12px;box-shadow:none}
.btn .icon{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- calendar ---------- */
.calendar-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.calendar-toolbar label{font-family:var(--font-mono);font-size:11px;color:var(--paper-dim)}
.calendar-toolbar input[type=date]{
  background:var(--ink-3);border:1px solid var(--ink-border);color:var(--paper);
  padding:7px 10px;border-radius:var(--radius-s);font-family:var(--font-body);font-size:13px;
}
.calendar-legend{display:flex;gap:16px;margin-left:auto;font-size:11.5px;color:var(--paper-dim);flex-wrap:wrap}
.calendar-legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block}

.calendar-month{margin-bottom:26px}
.calendar-month__title{font-family:var(--font-display);font-size:20px;margin-bottom:10px;letter-spacing:.3px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calendar-dow{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--paper-faint);padding-bottom:4px}
.calendar-cell{
  aspect-ratio:1;border-radius:var(--radius-s);border:1px solid var(--ink-border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11.5px;color:var(--paper-dim);background:var(--ink-2);position:relative;
}
.calendar-cell.has-day{cursor:pointer}
.calendar-cell.has-day:hover{border-color:var(--hikou-dim)}
.calendar-cell.is-empty{border-color:transparent;background:transparent}
.calendar-cell__daynum{font-weight:700;color:var(--paper)}
.calendar-cell__prognum{font-family:var(--font-mono);font-size:9px;color:var(--paper-faint)}
.calendar-cell.is-done{background:var(--hanko-dim);border-color:var(--hanko)}
.calendar-cell.is-done .calendar-cell__daynum{color:#fff}
.calendar-cell.is-today{outline:2px solid var(--hikou);outline-offset:-2px}
.calendar-cell.is-review{border-color:var(--hikou-dim)}

/* ---------- search ---------- */
.search-overlay{
  position:fixed;inset:0;background:rgba(6,6,8,0.82);backdrop-filter:blur(3px);
  z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:70px 20px;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.search-overlay.is-open{opacity:1;pointer-events:auto}
.search-panel{width:100%;max-width:560px;max-height:70vh;display:flex;flex-direction:column}
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ink-border)}
.search-input-wrap .icon{color:var(--paper-faint)}
.search-input{flex:1;background:none;border:none;color:var(--paper);font-size:16px;font-family:var(--font-body)}
.search-input:focus{outline:none}
.search-results{overflow-y:auto;padding:8px}
.search-result{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:var(--radius-s)}
.search-result:hover{background:var(--ink-3)}
.search-result__num{font-family:var(--font-mono);font-size:10.5px;color:var(--hanko-bright);width:30px;flex-shrink:0}
.search-result__title{font-size:13.5px;font-weight:600;color:var(--paper)}
.search-result__meta{font-size:11.5px;color:var(--paper-faint)}
.search-empty{padding:24px;text-align:center;color:var(--paper-faint);font-size:13px}

/* ---------- notes view ---------- */
.note-card{padding:16px 18px;margin-bottom:12px}
.note-card__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.note-card__day{font-family:var(--font-mono);font-size:11px;color:var(--hanko-bright)}
.note-card__title{font-size:13.5px;font-weight:700;color:var(--paper)}
.note-card__text{font-size:13.5px;color:var(--paper-dim);line-height:1.55;white-space:pre-wrap}

/* ---------- final project ---------- */
.deliverable-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.deliverable-card{padding:18px 20px}
.deliverable-card__num{font-family:var(--font-mono);font-size:10.5px;color:var(--paper-faint)}
.deliverable-card__title{font-family:var(--font-display);font-size:19px;color:var(--paper);margin:4px 0 8px;letter-spacing:.2px}
.deliverable-card__desc{font-size:13px;color:var(--paper-dim);line-height:1.55;margin-bottom:10px}
.deliverable-card__days{display:flex;gap:6px;flex-wrap:wrap}
.day-chip{font-family:var(--font-mono);font-size:10.5px;color:var(--hikou);border:1px solid var(--hikou-dim);border-radius:20px;padding:2px 8px}
.reality-box{margin-top:24px;padding:18px 20px;border-left:3px solid var(--gold);background:rgba(211,164,78,0.07)}
.reality-box__title{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.reality-box p{font-size:13.5px;color:var(--paper-dim);line-height:1.6}

/* ---------- start-here / materials ---------- */
.materials-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.materials-card{padding:16px 18px}
.materials-card__title{font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--paper);display:flex;align-items:center;gap:8px}
.materials-card__title .icon{color:var(--hanko-bright)}
.materials-card p{font-size:12.5px;color:var(--paper-dim);line-height:1.55}

/* ---------- toast ---------- */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-m);
  background:var(--ink-2);border:1.5px solid var(--hanko);box-shadow:var(--shadow-hard-lg);
  animation:toastIn .35s cubic-bezier(.34,1.56,.64,1) both;max-width:300px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
.toast.is-leaving{animation:toastOut .25s ease both}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast__title{font-size:12px;font-weight:700;color:var(--paper)}
.toast__sub{font-size:11.5px;color:var(--paper-dim)}

/* ---------- reset progress modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(6,6,8,.75);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-backdrop.is-open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:380px;padding:22px}
.modal h3{font-family:var(--font-display);font-size:20px;margin-bottom:10px}
.modal p{font-size:13.5px;color:var(--paper-dim);margin-bottom:18px;line-height:1.55}
.modal__actions{display:flex;gap:10px;justify-content:flex-end}

/* ---------- mobile tabbar ---------- */
.tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--ink-2);border-top:1px solid var(--ink-border-soft);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar__inner{display:flex;justify-content:space-around}
.tabbar__item{
  display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  color:var(--paper-faint);font-size:9.5px;font-family:var(--font-mono);padding:5px 8px;border-radius:8px;
}
.tabbar__item.is-active{color:var(--hanko-bright)}
.tabbar__item .icon{width:19px;height:19px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .sidebar{display:none}
  .topbar{display:flex}
  .tabbar{display:block}
  .main{padding:20px 16px 90px}
  .view-title{font-size:30px}
  .hero{grid-template-columns:1fr;text-align:center}
  .hero__ring-wrap{margin:0 auto}
  .hero__actions{justify-content:center}
  .sidebar.mobile-open{
    display:flex;position:fixed;top:0;left:0;bottom:0;width:82%;max-width:300px;z-index:50;height:100vh;box-shadow:8px 0 24px rgba(0,0,0,.5);
  }
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
  .sidebar-scrim.is-open{display:block}
}
@media (max-width:520px){
  .day-detail__top{flex-direction:row}
  .resource-card{flex-direction:column}
  .resource-card__thumb{width:100%;height:150px}
  .deliverable-grid{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001s!important;transition-duration:0.001s!important}
}

@media print{
  .sidebar,.topbar,.tabbar,#toast-container{display:none}
}
</style>

<script>
const CURRICULUM = {"resources":{"drawabox_l1":{"title":"Lesson 1: Lines, Ellipses & Boxes","creator":"Drawabox","embed_type":"site","url":"https://drawabox.com/lesson/1","why":"Drawabox is the most consistently recommended starting point for absolute beginners in the self-taught art community, and for good reason: Lesson 1 is the only major free course built entirely around building physical confidence and control before worrying about anything looking 'good.' Proko and Marc Brunet both assume some baseline control already exists — Drawabox is the one that actually builds it. Free, self-paced, and homework-checked by a real community."},"drawabox_l2":{"title":"Lesson 2: Contour Lines & Texture","creator":"Drawabox","embed_type":"site","url":"https://drawabox.com/lesson/2","why":"Bridges flat shapes into believable 3D form using contour curves — the same skill that later lets you wrap tone and cloth around a body convincingly. Chosen over jumping straight to Proko's forms content because Drawabox isolates the 'this is a surface in space' feeling before anatomy adds complexity on top."},"alphonso_dunn_penink":{"title":"Pen & Ink Workshop","creator":"Alphonso Dunn","embed_type":"channel","url":"https://www.youtube.com/c/ALPHONSODUNN","why":"A New York Academy of Art–trained instructor whose whole channel is devoted to confident, controlled mark-making with a pen — exactly the skill manga inking depends on. Chosen over generic 'how to ink' videos because Dunn teaches the mechanics of stroke control and the 'Line of Balance' concept, not just a finished look."},"marcbrunet_lineart":{"title":"How to Draw Good Lineart","creator":"Marc Brunet","embed_type":"channel","url":"https://www.youtube.com/@YTartschool","why":"Marc Brunet's channel is built for absolute beginners who feel intimidated, with a faster, funnier pace than Drawabox's text-heavy site. Used here as the loosening-up counterpart to Drawabox's precision drills — you need both a steady hand and a relaxed one."},"proko_gesture_playlist":{"title":"Gesture Drawing (full playlist)","creator":"Proko","embed_type":"playlist","yt_list":"PLtG4P3lq8RHEQ1kiN_Nub1vXR8fQQLjDF","url":"https://www.youtube.com/playlist?list=PLtG4P3lq8RHEQ1kiN_Nub1vXR8fQQLjDF","why":"Stan Prokopenko's gesture series is the single most-recommended free introduction to gesture across every major art-education community, ahead of Sycra's or Ejenkins' shorter takes, because it explains the *reasoning* (rhythm, flow, C/S-curves) rather than just demonstrating results you'd have to reverse-engineer."},"proko_gesture_howto":{"title":"How to Draw Gesture","creator":"Proko","embed_type":"video","yt_id":"74HR59yFZ7Y","url":"https://www.youtube.com/watch?v=74HR59yFZ7Y","why":"The specific first lesson of the gesture series — chosen as Day 1's video because it defines gesture/rhythm/flow before asking you to draw anything, so your first attempts aren't just guessing."},"ethan_becker_channel":{"title":"Gesture & Action-Pose Breakdowns","creator":"Ethan Becker","embed_type":"video","yt_id":"7TRlYMqjfIM","url":"https://www.youtube.com/watch?v=7TRlYMqjfIM","why":"A working animation-industry artist (Voltron, Studio Mir) whose 'one shape' gesture method is widely cited by digital artists as the missing link between Proko's academic rhythm lines and actually dynamic, weighted action poses — exactly what Phase 3's manga action work needs later."},"lovelifedrawing_gesture":{"title":"Figure Drawing Will Make Sense After This","creator":"Love Life Drawing","embed_type":"video","yt_id":"ZH6E_n51-BQ","url":"https://www.youtube.com/watch?v=ZH6E_n51-BQ","why":"Run by Mayko (a professional figure-drawing artist) and Kenzo, this channel built its 230k+ subscribers specifically by starting at 'step 1' when most life-drawing teaching assumes step 100. Chosen for its 11-step gesture breakdown, which is more procedural and beginner-safe than Proko's more intuitive approach — good to have both."},"moderndayjames_channel":{"title":"Weekly Figure & Gesture Practice","creator":"Moderndayjames","embed_type":"channel","url":"https://www.youtube.com/c/ModernDayJames/videos","why":"A working NY animator who live-streams practice and posts real, unpolished gesture sessions (his '400 Gesture Drawing Challenge' is a community landmark). Included specifically to show what *practice* looks like day-to-day, not just polished final demos — useful psychological reference for your own messy pages."},"proko_loomis_playlist":{"title":"Draw the Head From Any Angle (Loomis Method)","creator":"Proko","embed_type":"playlist","yt_list":"PL39135B8D190B7C97","url":"https://www.youtube.com/playlist?list=PL39135B8D190B7C97","why":"The definitive free teaching of Andrew Loomis's head-construction method, still cited by working professionals as a refresher. Chosen over Marc Brunet's or Sinix's head videos because it is the origin technique that manga-style head construction (Week 9) will later deliberately distort — you need the accurate version first to distort it on purpose instead of by accident."},"marcbrunet_male_body":{"title":"Drawing the Male Body (construction explained)","creator":"Marc Brunet","embed_type":"video","yt_id":"VUKd7BF8yC0","url":"https://youtu.be/VUKd7BF8yC0","why":"A faster, more energetic construction pass than Proko's anatomy course — used as the 'see the whole body built in one sitting' overview before Proko's slower, more detailed part-by-part lessons fill in the depth."},"marcbrunet_female_body":{"title":"Drawing the Female Body (construction explained)","creator":"Marc Brunet","embed_type":"channel","url":"https://www.youtube.com/@YTartschool","why":"Companion piece to the male-body video; Brunet explicitly teaches construction differences rather than treating 'default' anatomy as one gender, which matters for a manga cast with varied character types."},"proko_anatomy_course":{"title":"Anatomy of the Human Body for Artists","creator":"Proko","embed_type":"channel","url":"https://www.proko.com/course/anatomy-of-the-human-body","why":"The deepest free/paid anatomy series available from any single teacher on this list — ribcage, pelvis, spine and their interaction are covered as a *system*, not isolated parts, which is exactly what's needed to keep twisting manga action poses believable."},"lovelifedrawing_shapes":{"title":"These 10 Shapes Unlock All of Figure Drawing","creator":"Love Life Drawing","embed_type":"video","yt_id":"LQQXCJvy36Y","url":"https://www.youtube.com/watch?v=LQQXCJvy36Y","why":"Deliberately picked as the 'simplify the ribcage/pelvis down to shapes you can actually hold in your head' counterpart to Proko's denser anatomy lessons — use this when Proko's detail feels overwhelming."},"proko_hands":{"title":"Drawing Hands (full series)","creator":"Proko","embed_type":"channel","url":"https://www.proko.com/course/hands","why":"Repeatedly named by other instructors on this exact list (Sinix among them) as the best free hand tutorial on YouTube. Chosen over Marc Brunet's hands-and-feet video as the primary resource because it separately covers bone structure, muscle, and gesture — Brunet's video is kept as a faster secondary refresher."},"proko_feet_playlist":{"title":"Feet Anatomy (full playlist)","creator":"Proko","embed_type":"playlist","yt_list":"PLo1MyIYOwxxyJ_nVVg2v6Yv1K880i2BtP","url":"https://www.youtube.com/playlist?list=PLo1MyIYOwxxyJ_nVVg2v6Yv1K880i2BtP","why":"Feet are the most commonly skipped body part in self-taught curricula, so a dedicated, structure-first playlist (bones → gesture → shading) was chosen deliberately over a quick 5-minute overview video."},"marcbrunet_hands_feet":{"title":"How to Draw Hands & Feet","creator":"Marc Brunet","embed_type":"video","yt_id":"wSMhDiWmjy8","url":"https://youtu.be/wSMhDiWmjy8","why":"A quicker, more stylization-friendly pass used as a secondary reference once Proko's structural version has been practiced — useful for seeing how a working illustrator simplifies hands under time pressure, which is closer to real manga production speed."},"david_finch_folds":{"title":"How to Draw Clothing and Folds","creator":"David Finch","embed_type":"channel","url":"https://davidfinchart.com/library/","why":"David Finch is a 26-year Marvel/DC veteran (New Avengers, Moon Knight) who now teaches specifically for comic-page production — his folds lesson treats fabric as a storytelling and shading tool, not just texture, which fits manga's high-contrast, tone-driven rendering better than a generic fashion-illustration folds tutorial would."},"david_finch_hair":{"title":"Drawing Hair","creator":"David Finch","embed_type":"channel","url":"https://davidfinchart.com/library/","why":"Included as the 'realistic clump logic' counterpart to Mark Crilley's stylized manga-hair lessons the same week — seeing both a comics-realist and a manga-specific approach prevents hair from becoming either stiff or a copy-paste anime cliché."},"mark_crilley_playlist":{"title":"How to Draw (full tutorial playlist)","creator":"Mark Crilley","embed_type":"playlist","yt_list":"PLCD2CF65888663986","url":"https://www.youtube.com/playlist?list=PLCD2CF65888663986","why":"Crilley is the author of Mastering Manga and has the largest, most consistent manga-specific teaching catalog on YouTube (well over 200 million career views on drawing demos). He wasn't on your original list, but excluding him from a manga curriculum would be like excluding Proko from a figure-drawing one."},"sinix_design_channel":{"title":"Rendering, Shape Language & Value Structure","creator":"Sinix Design","embed_type":"channel","url":"https://www.youtube.com/@sinixdesign","why":"Sinix (Robert Stacy) has taught digital rendering since 2006 and is specifically known for shape-language and value-structure teaching — the exact bridge between 'anatomically correct' and 'reads clearly as a manga character at a glance,' which is the whole point of Phase 3."},"ctrlpaint_playlist":{"title":"Digital Painting Fundamentals (full course)","creator":"Ctrl+Paint (Matt Kohr)","embed_type":"playlist","yt_list":"PLPVQ_imP542_NB3Ruy5Jw8rDjwG7lDcK4","url":"https://www.ctrlpaint.com/library","why":"Chosen specifically for value theory because Kohr teaches principles as software-agnostic — they transfer directly whether you're rendering in Clip Studio Paint, Procreate, or pencil. The alternative (a CSP-specific tutorial) would have taught you a menu, not a skill."},"mark_crilley_manga_faces":{"title":"How to Draw Manga Faces: 2 Different Ways","creator":"Mark Crilley","embed_type":"video","yt_id":"tYdJk8f29x4","url":"https://www.youtube.com/watch?v=tYdJk8f29x4","why":"Deliberately shows two valid manga eye/face approaches instead of one 'correct' style, which matters for finding your own version rather than copying a single YouTuber's face template."},"naoki_saito_playlist":{"title":"Beginner Fundamentals (English-friendly playlist)","creator":"Naoki Saito","embed_type":"playlist","yt_list":"PLLiiluu3zijVBwnpqg2dTqaUm1f8O8Wc-","url":"https://www.youtube.com/playlist?list=PLLiiluu3zijVBwnpqg2dTqaUm1f8O8Wc-","why":"A working professional manga/character artist (Pokémon TCG, Dragalia Lost) whose channel rebuilt itself to 680k+ subscribers after being deleted without warning — he's cited repeatedly as the best teacher for how real Japanese studios actually simplify anatomy into shapes. Some videos are Japanese-audio with visual demonstration or community captions; the drawing process itself needs no translation."},"ahmed_aldoori_poses":{"title":"Drawing Dynamic Poses (Parts 1 & 2)","creator":"Ahmed Aldoori","embed_type":"video","yt_id":"gEKMHFdA5dQ","url":"https://www.youtube.com/watch?v=gEKMHFdA5dQ","why":"A concept artist recommended alongside Sinix and Marco Bucci in the same professional-instructor circles — chosen here because he narrates his *reasoning* live while exaggerating a pose, which is more transferable to your own characters than a static finished-pose gallery."},"david_finch_panels":{"title":"Sketching Figures, Perspective, and Panels","creator":"David Finch","embed_type":"video","yt_id":"L7-kfEwRbu4","url":"https://www.youtube.com/watch?v=L7-kfEwRbu4","why":"One of the only free tutorials by a veteran professional that shows perspective and panel layout being solved *together* in the same thumbnail sketch, rather than as two separate lessons — which is how it actually happens on a real manga page."},"david_finch_buildings":{"title":"Buildings in One-Point Perspective for Comics (Parts 1 & 2)","creator":"David Finch","embed_type":"video","yt_id":"B2Q5UmQJAVg","url":"https://www.youtube.com/watch?v=B2Q5UmQJAVg","why":"Chosen over a generic architecture-perspective tutorial because it's built specifically for comic-panel blocking speed — Finch shows the shortcuts a working artist actually uses under a deadline, not textbook-perfect vanishing-point geometry."},"drawlikeasir_paneling":{"title":"How to Draft and Panel Manga Pages","creator":"DrawlikeaSir (Marcel)","embed_type":"video","yt_id":"UGamHJjKwNw","url":"https://www.youtube.com/watch?v=UGamHJjKwNw","why":"Made by an artist who has published six volumes of his own manga series, so the advice (Z-pattern eye flow, fewer/larger panels, storyboard first) reflects what actually ships, not just page-layout theory. This is the most manga-specific paneling tutorial found in research, ahead of several generic 'comic layout' videos."},"scott_mccloud_ted":{"title":"The Visual Magic of Comics (TED Talk)","creator":"Scott McCloud","embed_type":"video","yt_id":"fXYckRgsdjI","url":"https://www.youtube.com/watch?v=fXYckRgsdjI","why":"McCloud's Understanding Comics essentially invented the modern vocabulary for panel-to-panel transitions and 'closure' (what your brain fills in between panels). This 17-minute talk was chosen over assigning the full book so the concept lands inside a single day, with the book noted as optional further reading."},"david_finch_inking":{"title":"Inking Tools for Comics","creator":"David Finch","embed_type":"channel","url":"https://davidfinchart.com/library/","why":"Covers the actual tool decision (nib pens, brush pens, digital) a working inker makes, rather than assuming you already own a specific pen — the right starting point before Alphonso Dunn's control exercises get re-applied to final line art."},"csp_screentone_official":{"title":"Quick Tip: Screentones","creator":"Clip Studio Paint (official)","embed_type":"video","yt_id":"X8yPpORl460","url":"https://www.youtube.com/watch?v=X8yPpORl460","why":"Straight from the software's own channel, so the menu paths and terminology exactly match what you'll click — chosen over third-party tone tutorials specifically to avoid outdated UI references."},"csp_screentone_manga":{"title":"Screentone Your Manga Like a Pro Mangaka","creator":"Jake Hercy Draws / community","embed_type":"video","yt_id":"RUA9fpG4aH4","url":"https://www.youtube.com/watch?v=RUA9fpG4aH4","why":"Goes further than the official tutorial into manga-specific tone use (cloth, water, sky, mood) rather than just the mechanics of applying a tone layer — the applied, house-style follow-up to the official reference."}},"weeks":[{"week":1,"phase":1,"days":[1,7],"title":"Line Confidence & Basic Shapes","review":{"assessment":"You should now be able to draw a straight line or a smooth curve in one confident pass, without a scratchy, hesitant 'sketchy' stroke — and know the difference the instant you see it on the page.","challenge":"One full page of confident-line studies: 20 superimposed lines, 20 ghosted lines, a table of 15 ellipses, and 3 simple objects (a mug, a book, a box) built entirely from straight lines and ellipses.","revision":"If lines still wobble or stop halfway, redo Days 1–2 before moving on — everything downstream depends on this, and it's the cheapest place in the whole roadmap to fix a habit.","confident":"Confident straight lines and ellipses in one pass, and simple objects built from basic shapes."}},{"week":2,"phase":1,"days":[8,15],"title":"Forms & Perspective","review":{"assessment":"You should be able to look at a flat shape and mentally 'inflate' it into a box, cylinder, or sphere, and place 2–3 of those forms in a scene that reads as one consistent space rather than floating separately.","challenge":"Draw a still life of 4 household objects simplified into boxes/cylinders/spheres, all sitting on one shared ground plane in simple 1-point perspective.","revision":"If objects feel like they're floating or facing random directions, redo the funnels and rough-perspective drills from Day 11–12 — that's a shared-vanishing-point problem, not a drawing-skill problem.","confident":"Boxes, cylinders and spheres in believable perspective, sharing one ground plane and one light logic."}},{"week":3,"phase":1,"days":[16,22],"title":"Construction & Gesture Drawing","review":{"assessment":"Given a 60-second reference pose, you should be able to capture its main flow line and weight distribution — not a perfect figure, just an honest, energetic line that shows what the pose is doing.","challenge":"A full page of 15 one-minute gesture thumbnails from mixed references (at least 3 from an actual manga/anime panel, not just photo refs), circling your 3 strongest.","revision":"If gestures look stiff or symmetrical, redo Day 18's Reilly-abstraction drills — stiffness almost always means you're tracing contour instead of feeling for the line of action.","confident":"A one-minute gesture sketch that captures the energy and balance of a pose, from photo or manga reference."}},{"week":4,"phase":1,"days":[23,30],"title":"Basic Heads & Basic Faces","review":{"assessment":"You should be able to construct a Loomis head from at least 3 different angles from imagination (not copying), and place eyes/nose/mouth in roughly correct proportion on each.","challenge":"A head-construction sheet: the same invented head drawn from front, 3/4, and profile, plus one simple expression (smiling) on the front view. This sheet becomes part of your Day-30 Phase 1 portfolio.","revision":"If the 3/4 view keeps collapsing, redo Day 24's angle drills specifically — it's the hardest of the three and the one most people rush.","confident":"A Loomis-constructed head from three angles, with basic facial features placed in correct proportion."}},{"week":5,"phase":2,"days":[31,37],"title":"Anatomy Basics & Proportions","review":{"assessment":"You should be able to explain out loud (even just to yourself) why the ribcage and pelvis tilt opposite directions in a contrapposto pose, and show that tilt in a construction drawing.","challenge":"Draw one standing figure, 7.5 heads tall, in a relaxed weight-on-one-leg pose, using only the ribcage/pelvis/spine construction method — no outline-tracing allowed.","revision":"If proportions keep drifting (head too big, legs too short), redo Day 31's head-unit measuring drill; that ruler-in-your-eye habit needs repetition, not talent.","confident":"A full standing figure with correctly proportioned ribcage-pelvis-spine construction in a relaxed pose."}},{"week":6,"phase":2,"days":[38,45],"title":"Hands & Feet","review":{"assessment":"You should be able to draw a relaxed open hand and a simple standing foot from construction (mitten-and-block for the hand, wedge-and-block for the foot) without immediately reaching for a photo reference.","challenge":"A hand/feet study sheet: 6 hand poses (open, fist, pointing, holding an object, relaxed, gesturing) and 4 foot angles (front, side, 3/4, from above).","revision":"If fingers all look like sausages of the same length, redo Day 39's knuckle-landmark drill — finger *length variation* reads as 'correct' far more than perfect outlines do.","confident":"Basic hand and foot construction from multiple angles, without tracing a reference."}},{"week":7,"phase":2,"days":[46,52],"title":"Hair & Clothing","review":{"assessment":"You should be able to draw hair as a small number of large clumps following a clear gravity/wind direction, and drape simple fabric with at least 2 correct fold types over a bent limb.","challenge":"Draw one clothed character bust with a manga-style hairstyle, showing folds pulling toward at least one bent joint (elbow or shoulder).","revision":"If hair reads as 'a pile of lines' rather than shapes, redo Day 46 — count your clumps out loud; if you can't count them, neither can the reader's eye.","confident":"Manga-styled hair with clear clump logic, and simple clothing folds that respond to the body underneath."}},{"week":8,"phase":2,"days":[53,60],"title":"Expressions, Lighting & Values","review":{"assessment":"You should be able to render a simple head in 3 flat value blocks (light/mid/shadow) with one consistent light source, and draw at least 4 distinct facial expressions from the same base head.","challenge":"A rendered character bust: one head, one light source, full value structure, plus a 4-panel expression strip (neutral, happy, angry, surprised) using the same construction.","revision":"If shadows appear on the wrong side or contradict each other across the face, redo Day 56 and physically mark your light source with an arrow before you start shading — every time.","confident":"A simply-rendered character head with one consistent light source, and a set of clearly distinct expressions."}},{"week":9,"phase":3,"days":[61,67],"title":"Manga Style & Character Design","review":{"assessment":"You should be able to look at your realistic head studies from Phase 1–2 and deliberately push them toward a manga style — simplified planes, iconic eye shapes — while keeping the underlying proportions correct.","challenge":"Character Design Sheet #1: 5–8 thumbnail concept sketches for your first original character, narrowed down to one refined design with a clear silhouette.","revision":"If every thumbnail has the same silhouette, redo Day 64's shape-language drill with more exaggerated shape choices (circle vs. triangle vs. square) before refining anything.","confident":"An original manga-style character design with a distinct, readable silhouette, from your own thumbnails."}},{"week":10,"phase":3,"days":[68,75],"title":"Dynamic Poses, Perspective & Composition","review":{"assessment":"You should be able to push a gesture pose into an exaggerated, foreshortened action pose (a punch or a jump) while keeping the anatomy readable, and place a character inside a simple perspective composition with a clear focal point.","challenge":"A 3-character dynamic lineup: your character from Week 9 plus two new original characters, all in different exaggerated action poses on one page.","revision":"If foreshortened limbs look broken rather than 'pointing at the viewer,' redo Day 69's overlap-and-size drills — foreshortening is 90% correct overlap, not perspective math.","confident":"Three original characters in dynamic, foreshortened poses with correct anatomy and a clear focal point."}},{"week":11,"phase":3,"days":[76,82],"title":"Backgrounds & Storytelling","review":{"assessment":"You should be able to place one of your characters inside a simple perspective background at a consistent scale and light direction, and lay out a full page of story beats as rough panel thumbnails before drawing a single clean line.","challenge":"A full rough thumbnail draft of your entire 5–10 page one-shot — every page, every panel, stick-figure loose — plus one finished character-in-background panel from that draft.","revision":"If your thumbnails read confusingly out of order, redo Day 80's Z-pattern panel-flow drill on just the worst page before touching anything else.","confident":"A full rough thumbnail draft of a multi-page manga story, plus one character correctly placed inside a background."}},{"week":12,"phase":3,"days":[83,90],"title":"Inking, Screentones & Final Project","review":{"assessment":"By Day 90 you should have a complete, inked and toned final portfolio — not perfect, but finished, consistent, and entirely your own construction from Day 1's lines onward.","challenge":"The full Day 90 final project (see Final Project tab): 3 characters, turnaround, expression sheet, hand sheet, dynamic pose sheet, background scene, cover illustration, and a 5–10 page one-shot manga, inked and toned.","revision":"If you're behind, prioritize finishing over polishing — a complete, slightly-rough 90-day portfolio teaches you more than a polished 60-day one you never finish. Extend into a Week 13 if you need it; the roadmap is a floor, not a deadline.","confident":"A complete, self-inked, self-toned original manga one-shot with a matching character portfolio."}}],"days":[{"id":1,"week":1,"phase":1,"title":"Superimposed & Ghosted Lines","objective":"Build the muscle memory for one confident stroke instead of a scratchy, hesitant line.","resources":["drawabox_l1"],"assignment":"Drawabox Lesson 1: Superimposed Lines (2 pages) and Ghosted Lines (2 pages). Ghost the motion 2-3 times above the page before your pen touches down, then commit — one pass, no going back to fix it.","time":"60–90 min","mistakes":["Scratchy back-and-forth strokes instead of one pass","Slowing down or wobbling mid-line","Going back over a line to 'fix' it"],"checklist":["Did I commit to each line without redrawing it?","Are my lines mostly straight from start to end?","Did I ghost the motion before committing?","Did I fill both full pages?"],"outcome":"A full page of single-pass lines that are visibly straighter and more confident than your very first attempt today."},{"id":2,"week":1,"phase":1,"title":"Ghosted Planes","objective":"Extend single-line confidence into connected multi-line shapes.","resources":["drawabox_l1"],"assignment":"Warm up with 10 more ghosted lines, then Drawabox's Ghosted Planes exercise: 10 planes, including some rotated off the horizontal.","time":"60–90 min","mistakes":["Corners that overshoot or don't meet","Drawing planes too small to see your own mistakes","Rushing the ghosting/planning step"],"checklist":["Do my plane corners meet cleanly?","Did I ghost every line before drawing it?","Are opposite sides of each plane roughly parallel?"],"outcome":"Planes with clean, decisive corners that look intentional rather than corrected after the fact."},{"id":3,"week":1,"phase":1,"title":"Table of Ellipses","objective":"Train smooth, consistent ellipses — the foundation of every cylinder and rounded form to come.","resources":["drawabox_l1"],"assignment":"Drawabox's Table of Ellipses: fill the full grid, drawing each ellipse 2–3 times in one continuous motion before lifting your pen.","time":"45–60 min","mistakes":["Pointy ends instead of smooth curves","Drawing from the wrist only instead of the whole arm","Ellipses that lose symmetry partway through"],"checklist":["Am I drawing from my shoulder/elbow, not just my wrist?","Do my ellipses close without a pointy overlap?","Is the width consistent across each one?"],"outcome":"A full page of rounder, smoother ellipses with no pointy 'eye' shapes at the seams."},{"id":4,"week":1,"phase":1,"title":"Ellipses in Motion: Funnels","objective":"Understand how an ellipse's angle changes as it rotates through space — the logic behind every cylinder, limb and neck you'll draw.","resources":["drawabox_l1"],"assignment":"Drawabox's Funnels exercise: draw the full set, keeping every ellipse aimed at one shared central axis.","time":"45–60 min","mistakes":["Ellipses that don't share one consistent central axis","Ellipses widening instead of narrowing as the funnel narrows","Ignoring the center line entirely"],"checklist":["Do all my ellipses point toward the same central axis?","Does the ellipse degree narrow correctly as the funnel narrows?"],"outcome":"A funnel where every ellipse clearly belongs to the same consistent 3D tube."},{"id":5,"week":1,"phase":1,"title":"From Shapes to Simple Objects","objective":"Combine straight lines and ellipses into simple, recognizable everyday objects.","resources":["drawabox_l1","marcbrunet_lineart"],"assignment":"Draw 6 simple objects (mug, book, box, can, phone, bottle) using only straight lines and ellipses — no shading, no detail beyond the basic construction.","time":"60 min","mistakes":["Jumping to outline without planning proportions first","Over-detailing instead of keeping it simple","Skipping the ghosted plan before each shape"],"checklist":["Did I plan proportions before starting each object?","Is each object recognizable at a glance?","Did every line stay confident, not sketchy?"],"outcome":"Six clean, simple objects that look intentional — proof that lines and ellipses alone can read as real things."},{"id":6,"week":1,"phase":1,"title":"Plotted Perspective & Organic Arcs","objective":"Get a first feel for a horizon line and a single vanishing point, and practice smooth arcing lines for later gesture work.","resources":["drawabox_l1"],"assignment":"Drawabox's Plotted Perspective mini-exercise, then 3 pages of arcing lines at varying curvature and length.","time":"60 min","mistakes":["Lines that wobble mid-arc instead of one smooth pass","Treating the vanishing point as optional","Uneven spacing between practice arcs"],"checklist":["Do all my perspective lines actually converge at one point?","Are my arcs smooth in a single confident pass?"],"outcome":"A first working sense of perspective space, and arcs smooth enough to reuse in gesture drawing next week."},{"id":7,"week":1,"phase":1,"title":"Week 1 Review — Confident-Line Portfolio Page","objective":"Consolidate the week's line, plane and ellipse drills into one confident portfolio page.","resources":["drawabox_l1"],"assignment":"One sitting, one page: 20 superimposed lines, 20 ghosted lines, a 15-ellipse table, and the 3 strongest objects from Day 5, redrawn fresh.","time":"90–120 min","mistakes":["Rushing just to finish instead of keeping each line confident","Comparing this page to professional work instead of your own Day 1","Skipping the self-check because the page 'feels done'"],"checklist":["Can I draw a straight line or smooth curve in one confident pass?","Do I know the difference between a confident line and a sketchy one on sight?","Am I ready to move on, or does Days 1–2 need a repeat?"],"outcome":"A single page that is visibly more confident than Day 1 — keep it; you'll want the comparison later."},{"id":8,"week":2,"phase":1,"title":"From Shapes to Forms: Boxes","objective":"Understand how a flat square becomes a solid 3D box using converging edges — the starting point of all construction drawing.","resources":["drawabox_l2"],"assignment":"Draw 15 boxes from different angles. Ghost a 2D shape first, then extrude 3 edges per box to give it depth.","time":"60–90 min","mistakes":["Edge sets that don't stay parallel or consistently converge","Boxes that look flat because every edge is the same length","Skipping the ghosted plan before extruding"],"checklist":["Do the 3 sets of parallel edges look parallel or convincingly convergent?","Does the box read as solid, not flat?","Did I vary the angles across the 15 boxes?"],"outcome":"A page of boxes that read as solid 3D forms from multiple angles, not flat diamonds."},{"id":9,"week":2,"phase":1,"title":"Cylinders in Space","objective":"Apply last week's ellipse skill to draw a cylinder that holds a consistent width as it travels through space.","resources":["drawabox_l2"],"assignment":"Draw 10 cylinders at varying angles and lengths, capping each end with a correctly matched ellipse.","time":"60 min","mistakes":["End ellipses that don't match each other's degree","Cylinders that taper by accident","Drawing the tube before establishing both end ellipses"],"checklist":["Do both end ellipses share the same width/degree logic?","Does the cylinder hold a consistent diameter unless I meant to taper it?"],"outcome":"Cylinders that read as solid tubes in space, not two disconnected ellipses joined by lines."},{"id":10,"week":2,"phase":1,"title":"Spheres & Basic Light Logic","objective":"Learn how one light source creates a terminator line, core shadow and cast shadow on the simplest possible form.","resources":["drawabox_l2"],"assignment":"Draw 6 spheres. Mark a light-source arrow on each BEFORE shading, then add simple 3-value shading (light / core shadow / cast shadow) to 3 of them.","time":"60 min","mistakes":["Shading before marking the light source","Treating the shadow edge as a hard outline instead of a soft value shift","Cast shadow pointing the wrong direction relative to the light"],"checklist":["Did I draw a light-source arrow before shading?","Does my cast shadow point away from the light, along the ground?"],"outcome":"A sphere that reads as a solid ball under one clear light source, not a flat circle with a dark smudge."},{"id":11,"week":2,"phase":1,"title":"1-Point Perspective","objective":"Use a horizon line and single vanishing point well enough to place a box convincingly inside a room.","resources":["drawabox_l1"],"assignment":"Draw a simple room in 1-point perspective: floor, back wall, and one box sitting inside it, all sharing one vanishing point.","time":"75 min","mistakes":["Receding lines that don't actually meet at the vanishing point","Horizon line that shifts partway through the drawing","Objects that ignore the perspective you already set up"],"checklist":["Do all my receding lines meet at one vanishing point?","Is my horizon line consistent across the whole drawing?"],"outcome":"A simple room that convincingly recedes into the distance from a single vanishing point."},{"id":12,"week":2,"phase":1,"title":"2-Point Perspective","objective":"Extend to two vanishing points for objects viewed at an angle — the perspective type most manga panels actually use.","resources":["drawabox_l1"],"assignment":"Draw 3 boxes of different sizes in 2-point perspective, all sharing the same horizon line and two vanishing points (even if one lands off the page).","time":"75 min","mistakes":["Vanishing points that drift between objects","Boxes that don't share one horizon line","Edges drawn freehand instead of aimed at the vanishing point"],"checklist":["Do all 3 boxes share the exact same two vanishing points?","Do vertical edges stay perfectly vertical?"],"outcome":"Multiple objects in 2-point perspective that clearly share one consistent space."},{"id":13,"week":2,"phase":1,"title":"Form Intersections","objective":"Practice how forms overlap and occlude each other believably — a cylinder poking through a box, a sphere resting in a bowl shape.","resources":["drawabox_l2"],"assignment":"Draw 6 pairs of overlapping forms (box+cylinder, sphere+box, cylinder+cylinder), marking clearly which surface sits in front at every overlap.","time":"60 min","mistakes":["Drawing both forms fully, then erasing overlaps sloppily","Losing track of which surface is actually in front","Intersections that ignore either form's established perspective"],"checklist":["Is it clear which form is in front at every overlap?","Do both forms still look individually correct in perspective?"],"outcome":"Confident intersections where two simple forms clearly occupy the same 3D space."},{"id":14,"week":2,"phase":1,"title":"Combining Forms Into an Object","objective":"Build one complete invented object entirely from boxes, cylinders and spheres in perspective.","resources":["drawabox_l1","drawabox_l2"],"assignment":"Design and construct one simple invented object (a toy robot, teapot, or desk lamp) using at least 3 different basic forms, sharing one perspective and one light source.","time":"75 min","mistakes":["Forms that don't share the same perspective space","Light direction that shifts between forms on the same object","Adding detail before the construction underneath is solid"],"checklist":["Do all the forms in my object share one consistent perspective?","Is my light source consistent across every form?"],"outcome":"One fully invented object, built entirely from your own construction — not traced or copied."},{"id":15,"week":2,"phase":1,"title":"Week 2 Review — Perspective Still Life","objective":"Consolidate forms and perspective into the week's portfolio piece.","resources":["drawabox_l1","drawabox_l2"],"assignment":"Draw a still life of 4 objects, each simplified into boxes/cylinders/spheres, all sitting on one shared ground plane in simple 1-point perspective.","time":"90–120 min","mistakes":["Rushing the ghosted planning step under time pressure","Forgetting to share one horizon line across all 4 objects","Letting light direction drift between objects"],"checklist":["Can I mentally 'inflate' a flat shape into a box, cylinder or sphere?","Do my 4 objects share one ground plane and one light logic?","Am I ready for gesture drawing, or does perspective need another day?"],"outcome":"A still life where 4 separate objects clearly share one believable 3D space."},{"id":16,"week":3,"phase":1,"title":"What Is Gesture? Line of Action","objective":"Learn to find and draw the single 'line of action' that captures a pose's core energy before any detail.","resources":["proko_gesture_howto","proko_gesture_playlist"],"assignment":"Watch Proko's 'How to Draw Gesture,' then draw 10 quick sketches (60–90 sec each) from any photo reference, using one single flowing line per pose before anything else.","time":"60 min","mistakes":["Drawing contour/outline instead of one flowing action line","Spending too long per pose","Using straight, stiff lines instead of curves"],"checklist":["Is there one clear dominant curve in each sketch?","Did I stay under 90 seconds per pose?"],"outcome":"Ten quick sketches that each show one clear, energetic line of action."},{"id":17,"week":3,"phase":1,"title":"Flow Lines & C/S Curves","objective":"Refine gesture lines using C-curves and S-curves that show the body's natural rhythm and weight shift.","resources":["proko_gesture_playlist","ethan_becker_channel"],"assignment":"15 gesture sketches (60–90 sec each). Before each one, label it a C-curve or S-curve pose in your head, then draw to match.","time":"60–75 min","mistakes":["Curves that are too symmetrical or generic","Ignoring which side of the body compresses vs. stretches","Drawing too slowly and losing the pose's energy"],"checklist":["Can I point to the compression side and the stretch side of each pose?","Do my curves feel intentional, not random?"],"outcome":"Gesture sketches with a clear compression/stretch relationship, not just generic wavy lines."},{"id":18,"week":3,"phase":1,"title":"Reilly Abstraction: Constructive Gesture","objective":"Break the torso into two connected rhythm masses — a ribcage 'bean' and a pelvis 'bucket' — instead of one blob.","resources":["proko_gesture_playlist","lovelifedrawing_shapes"],"assignment":"10 gesture sketches using a bean-shaped ribcage and bucket-shaped pelvis connected by a curving spine line, from mixed reference poses.","time":"75 min","mistakes":["Torso drawn as one solid blob with no separation","Ribcage and pelvis pointing the same direction even in a twisting pose","Spine line drawn perfectly straight"],"checklist":["Are ribcage and pelvis clearly two separate, connected shapes?","Does the spine curve to connect them naturally?"],"outcome":"Gestures with a visibly twisting, three-dimensional torso instead of a flat blob."},{"id":19,"week":3,"phase":1,"title":"Gesture + Basic Forms Overlay","objective":"Combine gesture flow lines with earlier form skills, treating limbs as tapered cylinders.","resources":["proko_gesture_playlist","drawabox_l2"],"assignment":"8 gesture sketches, then add simple cylinder/box limb construction on top of your 4 favorites.","time":"75 min","mistakes":["Construction that kills the original gesture's energy","Limbs drawn as straight tubes with no taper","Forgetting the joints where forms actually connect"],"checklist":["Does my construction still preserve the original gesture's flow?","Do my limb cylinders taper naturally toward the joints?"],"outcome":"Sketches that carry both energy (gesture) and structure (form) at the same time."},{"id":20,"week":3,"phase":1,"title":"Timed Gesture Practice Session","objective":"Build speed and instinct through volume against a real timer — the single highest-leverage gesture drill there is.","resources":["lovelifedrawing_gesture","moderndayjames_channel"],"assignment":"One 30-minute timed session: 20 poses at 60 seconds, then 10 poses at 30 seconds, using Love Life Drawing's practice approach.","time":"45 min (30 min drawing + review)","mistakes":["Stopping to fix mistakes mid-timer instead of moving on","Tensing up and slowing down as the timer gets shorter","Skipping the warm-up before the 30-second round"],"checklist":["Did I complete every pose within its time limit, even imperfectly?","Did my 30-second poses stay loose rather than freezing up?"],"outcome":"Visibly looser, faster gesture marks by the end of the session than at the start."},{"id":21,"week":3,"phase":1,"title":"Gesture, Weight & Balance","objective":"Learn to check a pose's line of gravity so standing figures don't look like they're about to topple over.","resources":["proko_gesture_playlist","lovelifedrawing_shapes"],"assignment":"10 standing-pose gesture sketches. Drop a straight vertical 'plumb line' from the neck pit down to check whether the weight is actually balanced over the feet.","time":"60 min","mistakes":["Weight balanced over neither foot","Weight-bearing leg drawn perfectly straight (real ones rarely are)","Skipping the plumb-line check entirely"],"checklist":["Does my plumb line land on or between a foot, not off to the side?","Is there a clear weight-bearing leg versus a relaxed leg?"],"outcome":"Standing poses that feel physically balanced and grounded instead of precariously tipping."},{"id":22,"week":3,"phase":1,"title":"Week 3 Review — Gesture Thumbnail Page","objective":"Consolidate a week of gesture practice into the week's portfolio page.","resources":["proko_gesture_playlist","lovelifedrawing_gesture"],"assignment":"One page of 15 one-minute gesture thumbnails from mixed references — at least 3 from an actual manga or anime panel. Circle your 3 strongest.","time":"60–75 min","mistakes":["Choosing only 'safe' static poses instead of dynamic ones","Spending more than 90 seconds per thumbnail","Skipping the manga-reference poses"],"checklist":["Can I capture a pose's flow and weight in about 60 seconds?","Do at least 3 of my thumbnails come from manga/anime reference?","Which of the 15 is genuinely my strongest, and why?"],"outcome":"A page of 15 thumbnails with 3 clear standouts — proof gesture is becoming instinct, not effort."},{"id":23,"week":4,"phase":1,"title":"Loomis Head: Sphere & Cranial Mass","objective":"Learn the core Loomis construction — a sphere plus a flat side-plane 'ramus' block for the jaw — the skeleton for every head you'll draw.","resources":["proko_loomis_playlist"],"assignment":"Draw 8 Loomis head spheres from a front-facing angle, adding the cranial cross-lines (browline, centerline) and the jaw ramus block to each.","time":"60–75 min","mistakes":["Cross-lines drawn flat instead of wrapping the sphere's curve","Jaw block attached at the wrong height","Treating the sphere as the whole head instead of just the cranium"],"checklist":["Do my centerline and browline actually curve around the sphere?","Is the jaw block attached at a consistent, correct height?"],"outcome":"A Loomis head sphere with correctly wrapped guidelines, ready to hold facial features."},{"id":24,"week":4,"phase":1,"title":"The Head at Different Angles","objective":"Rotate the Loomis construction through 3/4 and profile views without it falling apart.","resources":["proko_loomis_playlist"],"assignment":"Draw the same invented head from front, 3/4, and profile, keeping the cross-line logic consistent across all three angles.","time":"75–90 min","mistakes":["3/4 guideline that doesn't curve with the rotated sphere","Profile view losing the cranial mass behind the face","Each angle looking like a different person"],"checklist":["Do all three angles read as the same head rotating, not three different heads?","Does my 3/4 guideline correctly compress toward the far side?"],"outcome":"The same constructed head, recognizable across three different angles."},{"id":25,"week":4,"phase":1,"title":"Facial Landmarks","objective":"Learn standard guideline placement for eyes, brows, nose base and chin using head-unit proportions.","resources":["proko_loomis_playlist"],"assignment":"On 5 fresh Loomis heads, mark the eyeline, browline, base-of-nose line and chin using the 'eyes at the halfway point' rule — no final features yet.","time":"45–60 min","mistakes":["Eyes placed too high (the most common beginner error)","Ignoring the halfway-point rule entirely","Guidelines drawn flat instead of wrapping the head's curve"],"checklist":["Are my eyes at the vertical halfway point of the head, not higher?","Do the guidelines stay consistent across all 5 heads?"],"outcome":"Correctly proportioned facial guideline placement you can now do from memory."},{"id":26,"week":4,"phase":1,"title":"Basic Facial Features","objective":"Construct generic (non-stylized) eyes, nose and mouth on Day 25's guidelines — an accurate base before Phase 3 stylizes it.","resources":["proko_loomis_playlist"],"assignment":"Add simple constructed eyes, nose, and mouth to 4 of your Day 25 heads, in both front and 3/4 view.","time":"60–75 min","mistakes":["Eyes drawn as flat almond shapes with no eyeball/lid structure","Nose drawn as a floating triangle disconnected from the face","Mouth ignoring the curve of the jaw beneath it"],"checklist":["Do my eyes sit inside eye sockets, not floating on the surface?","Does my nose connect to the browline rather than floating?"],"outcome":"A believable, correctly proportioned realistic face — your accuracy baseline before Phase 3 stylizes it."},{"id":27,"week":4,"phase":1,"title":"Head Tilts & Simple Foreshortening","objective":"Practice tilting the head up and down, where most beginner head drawings actually fall apart.","resources":["proko_loomis_playlist"],"assignment":"Draw 6 heads tilted up and 6 tilted down, keeping the cross-line guidelines curving correctly through each tilt.","time":"60–75 min","mistakes":["Guidelines that stay flat/horizontal regardless of tilt","Features that ignore the tilt and sit 'flat-on' anyway","Treating up/down tilt as a separate skill instead of the same sphere logic extended"],"checklist":["Do my guidelines curve correctly for an up-tilt versus a down-tilt?","Do features follow the tilted guidelines rather than sitting flat?"],"outcome":"Heads that convincingly look up or down, not just side to side."},{"id":28,"week":4,"phase":1,"title":"Simple Expressions","objective":"Move eyebrows, eyes and mouth together, not separately, to construct 3 basic realistic expressions on your accurate head base.","resources":["proko_loomis_playlist"],"assignment":"Draw the same constructed head 3 times — neutral, smiling, surprised — changing brow, eye and mouth together as one coordinated unit each time.","time":"60 min","mistakes":["Changing only the mouth and leaving the brows neutral (the #1 reason expressions look fake)","Copying a reference expression without understanding which muscles moved","Over-exaggerating before the basic version is solid"],"checklist":["Did brows, eyes AND mouth all change together for each expression?","Is each expression clearly readable at a glance?"],"outcome":"Three clearly distinct, believable expressions built from one consistent head construction."},{"id":29,"week":4,"phase":1,"title":"Combine Gesture Body + Constructed Head","objective":"Merge Week 3's gesture-body work with Week 4's head construction into one simple, complete figure.","resources":["proko_gesture_playlist","proko_loomis_playlist"],"assignment":"Draw 4 simple full figures: a gesture-based body topped with a properly constructed head, matching the head's tilt to the body's action line.","time":"75–90 min","mistakes":["Head construction that ignores the body's tilt or action line","Body gesture losing its energy once a 'careful' head is added","Neck drawn as a straight, rigid cylinder"],"checklist":["Does the head's tilt match the direction the body's gesture is moving?","Did the body keep its gesture energy after adding the head?"],"outcome":"A simple complete figure where head and body clearly belong to the same pose."},{"id":30,"week":4,"phase":1,"title":"Phase 1 Review — Full Construction Study Sheet","objective":"Demonstrate everything from Phase 1 on one consolidated sheet, and honestly self-assess before Phase 2 begins.","resources":["proko_gesture_playlist","proko_loomis_playlist","drawabox_l1"],"assignment":"One full portfolio sheet: 3 gesture figures with constructed heads, plus a small perspective still life in the corner. Then write 3 honest sentences about your single weakest Phase 1 skill.","time":"120 min","mistakes":["Skipping the honest self-assessment because it feels uncomfortable","Carrying an unresolved Week 1 line-confidence issue straight into Phase 2","Comparing this page to a professional's work instead of your own Day 1"],"checklist":["Can I honestly name my single weakest Phase 1 skill?","Would I be comfortable starting Phase 2 tomorrow, or do a few review days make sense first?","Have I kept every dated page so far — you'll want the before/after later"],"outcome":"A completed Phase 1 portfolio sheet, and a clear, honest sense of which foundation skill still needs attention going into Phase 2."},{"id":31,"week":5,"phase":2,"title":"Figure Proportions","objective":"Learn to measure a figure in 'head units' (roughly 7.5–8 heads tall) so proportions stop drifting.","resources":["marcbrunet_male_body","marcbrunet_female_body","proko_anatomy_course"],"assignment":"Draw 4 standing gesture figures (mix of body types), then measure each in head-units using your own drawn head as the ruler, adjusting until each reads as 7.5–8 heads tall.","time":"60–75 min","mistakes":["Guessing proportions instead of measuring","Head drawn too large relative to the body (very common)","Head-unit size drifting within one figure"],"checklist":["Did I use my own drawn head as the measuring unit?","Does my figure read as roughly 7.5–8 heads tall?"],"outcome":"Figures with proportions that hold up under a ruler check, not just ones that 'look about right.'"},{"id":32,"week":5,"phase":2,"title":"Skeleton Basics: Ribcage & Pelvis","objective":"Simplify the ribcage into an egg/barrel form and the pelvis into a bucket form — the two masses that drive all torso construction.","resources":["proko_anatomy_course","lovelifedrawing_shapes"],"assignment":"Draw the ribcage barrel and pelvis bucket separately, 5 times each from different angles, before connecting them with a spine.","time":"60 min","mistakes":["Ribcage drawn as a flat oval with no thickness","Pelvis drawn too small relative to the ribcage","Ignoring each form's own internal perspective"],"checklist":["Does my ribcage read as a 3D barrel, not a flat oval?","Is my pelvis roughly proportional in size to the ribcage?"],"outcome":"Two independently solid torso masses, ready to be connected and twisted next."},{"id":33,"week":5,"phase":2,"title":"Ribcage–Pelvis Relationship: Contrapposto","objective":"Learn how ribcage and pelvis tilt in opposite directions in a natural standing pose — the single biggest lever for believable figures.","resources":["proko_anatomy_course","marcbrunet_male_body"],"assignment":"Draw 6 torsos in contrapposto, exaggerating the opposite-tilt relationship between ribcage and pelvis before dialing it back to natural.","time":"75 min","mistakes":["Ribcage and pelvis tilting the same direction","Torso that reads as rigid or frozen instead of relaxed","Forgetting the spine's curve connecting the two masses"],"checklist":["Do my ribcage and pelvis clearly tilt in opposite directions?","Does the connecting spine curve naturally between them?"],"outcome":"Torsos with a natural, weight-shifted contrapposto feel instead of stiff symmetry."},{
